<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Starling">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Starling Field Journal</title>
<style>
/* ============================================================= *
 * Field Journal — design tokens (§12.1). Established Phase 0,    *
 * extended here; reused unchanged in later phases.              *
 * ============================================================= */
:root{
  --paper:#f6f1e4; --paper-2:#efe7d3; --paper-3:#e7dcc2;
  --ink:#2b2117; --ink-2:#6b5a45; --ink-3:#8c7a60;
  --rule:#cabd9f; --rule-soft:#ded2b6;
  --wash-mammal:#cba38c; --wash-bird:#9fb0bd; --wash-reptile-amphibian:#b9c3a8;
  --wash-insect:#d8c38a; --wash-plant:#a9bb9a; --wash-other:#c3b6cf;
  --good:#4f6b45; --bad:#9a4a3c; --warn:#977a2e;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:Georgia,"Times New Roman","EB Garamond",serif;
  --tab-h:60px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.45;
  -webkit-text-size-adjust:100%;
  overscroll-behavior-y:none;
}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle;flex:0 0 auto;}
.ico .fill{fill:currentColor;stroke:none;}
.emoji-ico{display:inline-flex;align-items:center;justify-content:center;line-height:1;}

/* ---- app frame ---- */
#app{min-height:100%;padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom));}
.screen{display:none;padding:0 16px 24px;max-width:680px;margin:0 auto;}
.screen.active{display:block;}
.topbar{
  position:sticky;top:0;z-index:15;background:var(--paper);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  border-bottom:1px solid var(--rule); max-width:680px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.topbar h1{font-family:var(--serif);font-weight:600;font-size:22px;margin:0;letter-spacing:.02em;}
.topbar .sub{font-variant:small-caps;letter-spacing:.12em;color:var(--ink-2);font-size:11px;}
.iconbtn{background:none;border:1px solid transparent;color:var(--ink);padding:8px;
  border-radius:4px;cursor:pointer;display:inline-flex;min-width:44px;min-height:44px;
  align-items:center;justify-content:center;}
.iconbtn:active{background:var(--paper-3);}

/* ---- update banner ---- */
#updateBanner{display:none;position:sticky;top:0;z-index:30;background:var(--ink);color:var(--paper);
  padding:10px 14px;align-items:center;justify-content:space-between;gap:12px;font-size:14px;}
#updateBanner.show{display:flex;}
#updateBanner button{background:var(--paper);color:var(--ink);border:1px solid var(--paper);
  padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;border-radius:2px;}

/* ---- generic ---- */
.rule{height:1px;background:var(--rule);border:0;margin:16px 0;}
.section-label{font-variant:small-caps;letter-spacing:.14em;color:var(--ink-2);font-size:12px;
  margin:20px 0 8px;display:flex;align-items:center;gap:8px;}
.section-label::after{content:"";flex:1;height:1px;background:var(--rule-soft);}
button.act{-webkit-appearance:none;appearance:none;font-family:var(--sans);font-size:15px;
  background:var(--paper);color:var(--ink);border:1px solid var(--ink);border-radius:3px;
  padding:11px 16px;min-height:44px;cursor:pointer;}
button.act:active{background:var(--ink);color:var(--paper);}
button.act.ghost{border-color:var(--rule);color:var(--ink-2);}
button.act.danger{border-color:var(--bad);color:var(--bad);}
button.act.danger:active{background:var(--bad);color:var(--paper);}
button.act[disabled]{opacity:.4;pointer-events:none;}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;}
input[type=text],input[type=date],input[type=time],input[type=number],textarea,select{
  font-family:var(--sans);font-size:16px;color:var(--ink);background:var(--paper);
  border:1px solid var(--rule);border-radius:3px;padding:10px 12px;width:100%;}
input:focus,textarea:focus,select:focus{outline:2px solid var(--ink);outline-offset:1px;border-color:var(--ink);}
textarea{resize:vertical;min-height:64px;}
label.fld{display:block;font-variant:small-caps;letter-spacing:.1em;color:var(--ink-2);
  font-size:12px;margin-bottom:6px;}

/* ---- Log: species picker ---- */
.spwrap{margin-top:4px;}
.sp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;}
.sp-cell{border:1px solid var(--rule);background:var(--paper-2);border-radius:4px;padding:10px 6px;
  display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-height:76px;
  text-align:center;color:var(--ink);}
.sp-cell:active{background:var(--paper-3);}
.sp-cell.sel{border-color:var(--ink);border-width:2px;background:var(--paper);}
.sp-cell .ico{width:30px;height:30px;}
.sp-cell .nm{font-size:11.5px;line-height:1.2;}
.sp-cell.add{border-style:dashed;color:var(--ink-2);justify-content:center;}
.sp-search{margin:10px 0;}
.cat-group{margin-top:10px;}
.cat-head{font-variant:small-caps;letter-spacing:.12em;color:var(--ink-2);font-size:12px;margin:12px 0 6px;}

/* ---- chips (spots, segments) ---- */
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{border:1px solid var(--rule);background:var(--paper-2);border-radius:20px;padding:9px 14px;
  font-size:14px;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;gap:6px;color:var(--ink);}
.chip:active{background:var(--paper-3);}
.chip.sel{border-color:var(--ink);border-width:2px;padding:8px 13px;background:var(--paper);}
.chip.add{border-style:dashed;color:var(--ink-2);}
.chip.disabled{opacity:.45;pointer-events:none;}
.seg{display:flex;gap:0;border:1px solid var(--rule);border-radius:4px;overflow:hidden;}
.seg button{flex:1;background:var(--paper);border:0;border-right:1px solid var(--rule);
  padding:11px 4px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;min-height:44px;
  display:flex;flex-direction:column;align-items:center;gap:3px;}
.seg button:last-child{border-right:0;}
.seg button .ico{width:18px;height:18px;}
.seg button.sel{background:var(--ink);color:var(--paper);}
.seg button.suggest{box-shadow:inset 0 0 0 2px var(--warn);}
.disclosure{background:none;border:0;color:var(--ink-2);font-size:13px;padding:6px 0;cursor:pointer;
  text-decoration:underline;text-underline-offset:2px;}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--rule);border-radius:4px;overflow:hidden;}
.stepper button{width:48px;height:44px;background:var(--paper);border:0;font-size:22px;color:var(--ink);cursor:pointer;}
.stepper button:active{background:var(--paper-3);}
.stepper .val{min-width:56px;text-align:center;font-size:17px;border-left:1px solid var(--rule);
  border-right:1px solid var(--rule);height:44px;display:flex;align-items:center;justify-content:center;color:var(--ink);}
.stepper .val.empty{color:var(--ink-3);}
.placename{font-size:12.5px;color:var(--ink-2);margin-top:8px;}
.placename input{font-size:14px;padding:6px 8px;margin-top:4px;}

.save-btn{width:100%;font-size:18px;padding:16px;margin-top:22px;min-height:56px;}
.edit-banner{background:var(--paper-3);border:1px solid var(--rule);border-radius:4px;padding:8px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:12px;}

/* ---- Journal ---- */
.day-head{font-variant:small-caps;letter-spacing:.1em;color:var(--ink-2);font-size:13px;
  border-bottom:1px solid var(--rule);padding:14px 0 5px;margin-top:6px;position:sticky;
  top:calc(var(--topbar-h,54px) + var(--filter-h,0px));z-index:5;background:var(--paper);}
.entry{display:flex;gap:12px;padding:12px 2px;border-bottom:1px solid var(--rule-soft);cursor:pointer;align-items:flex-start;}
.entry:active{background:var(--paper-2);}
.entry .ico-wrap{width:38px;height:38px;border-radius:50%;border:1px solid var(--rule);background:var(--paper-2);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.entry .ico-wrap .ico{width:24px;height:24px;}
.entry .body{flex:1;min-width:0;}
.entry .nm{font-family:var(--serif);font-size:16px;}
.entry .meta{font-size:12.5px;color:var(--ink-2);margin-top:1px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;}
.entry .meta .ico{width:14px;height:14px;}
.entry .snip{font-size:13px;color:var(--ink-2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.count-badge{border:1px solid var(--rule);border-radius:10px;padding:0 7px;font-size:12px;color:var(--ink-2);}

/* ---- empty states ---- */
.empty{text-align:center;padding:48px 20px;color:var(--ink-2);}
.empty .ico{width:44px;height:44px;color:var(--rule);margin-bottom:12px;}
.empty p{font-family:var(--serif);font-size:16px;margin:0 0 16px;}

/* ---- sheets / modals ---- */
.sheet-scrim{position:fixed;inset:0;background:rgba(43,33,23,.34);z-index:40;display:none;}
.sheet-scrim.show{display:block;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--paper);
  border-top-left-radius:14px;border-top-right-radius:14px;border-top:1px solid var(--ink);
  max-height:90vh;overflow-y:auto;transform:translateY(100%);transition:transform .18s ease;
  padding:8px 18px calc(24px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto;}
.sheet.show{transform:translateY(0);}
.sheet .grip{width:38px;height:4px;background:var(--rule);border-radius:2px;margin:8px auto 12px;}
.sheet h2{font-family:var(--serif);font-size:20px;margin:2px 0 4px;}
.sheet .sub{color:var(--ink-2);font-size:13px;margin:0 0 14px;}
.field-block{margin:14px 0;}
@media (prefers-reduced-motion:reduce){.sheet{transition:none;}}

/* detail: specimen labels (§12.3) */
.spec-plate{display:flex;gap:14px;align-items:center;margin:6px 0 14px;}
.spec-plate .ico-wrap{width:64px;height:64px;border:1px solid var(--ink);border-radius:6px;
  background:var(--paper-2);display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  box-shadow:inset 0 0 0 3px var(--paper);}
.spec-plate .ico-wrap .ico{width:40px;height:40px;}
.spec-plate .nm{font-family:var(--serif);font-size:21px;}
.spec-plate .cat{font-variant:small-caps;letter-spacing:.12em;color:var(--ink-2);font-size:12px;}
.dl-detail{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14.5px;margin:8px 0;}
.dl-detail dt{font-variant:small-caps;letter-spacing:.08em;color:var(--ink-2);}
.dl-detail dd{margin:0;}
.moon-line{display:flex;align-items:center;gap:8px;}
.moon-line .ico{width:22px;height:22px;}

/* ---- tab bar ---- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);
  border-top:1px solid var(--rule);display:flex;height:calc(var(--tab-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);max-width:680px;margin:0 auto;}
.tabbar button{flex:1;background:none;border:0;color:var(--ink-2);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;
  font-variant:small-caps;letter-spacing:.08em;}
.tabbar button .ico{width:24px;height:24px;}
.tabbar button.active{color:var(--ink);}
.tabbar button.active .ico{stroke-width:1.9;}

/* ---- toast ---- */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 14px);
  z-index:50;background:var(--ink);color:var(--paper);border-radius:6px;padding:12px 16px;
  display:none;align-items:center;gap:14px;font-size:14px;max-width:92vw;box-shadow:0 4px 16px rgba(43,33,23,.3);}
#toast.show{display:flex;}
#toast button{background:none;border:1px solid var(--paper);color:var(--paper);border-radius:3px;
  padding:5px 12px;font:inherit;font-size:13px;cursor:pointer;}
.warn-banner{background:var(--paper-3);border:1px solid var(--warn);border-radius:4px;padding:10px 12px;
  font-size:13.5px;color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0;}
.warn-banner button{background:none;border:0;color:var(--ink-2);font-size:20px;cursor:pointer;line-height:1;padding:0 4px;}
.list-row{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--rule-soft);}
.list-row .grow{flex:1;min-width:0;}
.list-row .ico{width:22px;height:22px;}
.muted{color:var(--ink-2);font-size:13px;}
.small-note{color:var(--ink-3);font-size:12px;}
.tag{font-variant:small-caps;letter-spacing:.06em;font-size:11px;border:1px solid var(--rule);
  border-radius:3px;padding:1px 6px;color:var(--ink-2);}

/* ---- Phase 2: filter bar ---- */
.filter-bar{background:var(--paper);padding:8px 0 0;}
/* Only the one-line summary sticks; the panel scrolls. Day-heads clear both. */
.filter-summary{position:sticky;top:var(--topbar-h,54px);z-index:6;background:var(--paper);
  display:flex;gap:8px;align-items:center;padding-bottom:8px;}
.filter-panel{border:1px solid var(--rule);background:var(--paper-2);border-radius:4px;padding:10px 12px;margin-top:2px;}
.filter-panel .flabel{font-variant:small-caps;letter-spacing:.1em;color:var(--ink-2);font-size:11px;margin:10px 0 5px;}
.filter-panel .flabel:first-child{margin-top:0;}
.filter-panel .chips{gap:6px;}
.filter-panel .chip{padding:6px 11px;font-size:13px;min-height:34px;}
.filter-panel .chip.sel{padding:5px 10px;}
.filter-dates{display:flex;gap:8px;align-items:center;}
.filter-dates input{flex:1;}

/* ---- Phase 2: map ---- */
/* isolate:isolate traps Leaflet's internal z-indexes (200–1000) so the map
   never renders over the app scrim/sheet/toast. */
#leafletMap{height:calc(100dvh - var(--topbar-h,54px) - 200px);min-height:320px;width:100%;
  border:1px solid var(--rule);border-radius:4px;background:var(--paper-3);position:relative;z-index:0;isolation:isolate;}
.map-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 2px;}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);}
.chk input{width:18px;height:18px;}
#mapNotice:empty,#pinNotice:empty{display:none;}
/* sepia Leaflet skin */
.leaflet-container{background:var(--paper-3);font-family:var(--sans);}
.leaflet-bar a,.leaflet-bar a:hover{background:var(--paper);color:var(--ink);border-bottom-color:var(--rule);}
.leaflet-control-attribution{background:rgba(246,241,228,.82)!important;color:var(--ink-2)!important;font-size:10px;}
.leaflet-control-attribution a{color:var(--ink-2)!important;}
.fj-marker{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;
  background:var(--paper);border:1.5px solid var(--ink);box-shadow:0 1px 3px rgba(43,33,23,.35);color:var(--ink);}
.fj-marker .ico{width:20px;height:20px;}
.fj-spot{color:var(--ink-2);}
.fj-pin{font-size:16px;color:var(--bad);}
.fj-cluster{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;
  background:var(--paper-2);border:1.5px solid var(--ink);color:var(--ink);font-size:13px;font-family:var(--serif);}
.leaflet-popup-content-wrapper{background:var(--paper);color:var(--ink);border-radius:5px;border:1px solid var(--ink);}
.leaflet-popup-tip{background:var(--paper);border:1px solid var(--ink);}
.fj-popup .pnm{font-family:var(--serif);font-size:15px;}
.fj-popup .pmeta{font-size:12px;color:var(--ink-2);}
.fj-popup button{margin-top:6px;font-size:12px;padding:4px 8px;border:1px solid var(--ink);background:var(--paper);border-radius:3px;cursor:pointer;}
#pinMap{height:300px;width:100%;border:1px solid var(--rule);border-radius:4px;background:var(--paper-3);margin-top:6px;}
.pin-search{position:relative;}
.pin-results{border:1px solid var(--rule);border-top:0;border-radius:0 0 4px 4px;max-height:180px;overflow-y:auto;background:var(--paper);}
.pin-results div{padding:9px 12px;border-bottom:1px solid var(--rule-soft);cursor:pointer;font-size:13.5px;}
.pin-results div:active{background:var(--paper-2);}

/* ---- Phase 3: photos + weather ---- */
.filebtn{display:inline-flex;align-items:center;min-height:44px;padding:11px 16px;border:1px solid var(--ink);
  border-radius:3px;font-size:15px;cursor:pointer;background:var(--paper);color:var(--ink);
  -webkit-user-select:none;user-select:none;}
/* §3.3 EXIF suggestion chip — entry-flow rules: plain, no washes, big targets */
#exifChip:empty{display:none;}
.exif-chip{margin-top:10px;border:1px solid var(--rule);border-radius:4px;background:var(--paper-2);
  padding:8px 10px;display:flex;align-items:center;gap:8px;font-size:14px;}
.exif-chip .xc-txt{flex:1;min-width:0;line-height:1.4;}
.filebtn:active{background:var(--ink);color:var(--paper);}
.filebtn input{display:none;}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.thumb{position:relative;width:74px;height:74px;border:1px solid var(--ink-2);border-radius:3px;overflow:hidden;background:var(--paper-3);}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.thumb .thumb-x{position:absolute;top:2px;right:2px;width:22px;height:22px;border:0;border-radius:50%;
  background:var(--ink);color:var(--paper);font-size:14px;line-height:22px;text-align:center;cursor:pointer;padding:0;}
.thumb.loading{display:flex;align-items:center;justify-content:center;}
.spin{width:22px;height:22px;border:2px solid var(--rule);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none;}}
.entry .ephoto{width:38px;height:38px;flex:0 0 auto;border:1px solid var(--rule);border-radius:3px;object-fit:cover;background:var(--paper-3);}
.wx-line{display:flex;align-items:center;gap:8px;}
.wx-line .ico{width:20px;height:20px;}
.photo-strip{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;}
.photo-strip img{width:88px;height:88px;object-fit:cover;border:1px solid var(--ink-2);border-radius:3px;cursor:zoom-in;}
.zoom-overlay{position:fixed;inset:0;z-index:60;background:rgba(43,33,23,.92);display:none;align-items:center;justify-content:center;}
.zoom-overlay.show{display:flex;}
.zoom-overlay img{max-width:96vw;max-height:92vh;object-fit:contain;}

/* ---- Phase 4: almanac ---- */
.al-controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0;}
.al-controls select{width:auto;min-width:130px;flex:1;}
.year-pager{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--rule);border-radius:4px;}
.year-pager button{width:40px;height:40px;background:var(--paper);border:0;font-size:18px;color:var(--ink);cursor:pointer;}
.year-pager button:disabled{opacity:.35;pointer-events:none;}
.year-pager .yr{min-width:56px;text-align:center;font-family:var(--serif);}
.heat-table{border:1px solid var(--rule);border-radius:4px;padding:8px 6px;overflow-x:auto;background:var(--paper-2);}
.heat-row{display:flex;align-items:center;gap:2px;margin:1px 0;}
.heat-mon{font-variant:small-caps;letter-spacing:.06em;font-size:10px;color:var(--ink-2);width:30px;flex:0 0 30px;text-align:right;padding-right:4px;}
.heat-cell{width:9px;height:9px;flex:0 0 9px;border-radius:1px;background:var(--paper-3);cursor:default;}
.heat-cell.has{cursor:pointer;}
.heat-legend{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-2);margin-top:8px;justify-content:flex-end;}
.heat-legend .heat-cell{cursor:default;}
.day-list{margin-top:10px;}
.al-title{font-family:var(--serif);font-size:17px;margin:14px 0 4px;}
.al-svg{width:100%;height:auto;display:block;border:1px solid var(--rule);border-radius:4px;background:var(--paper-2);margin-top:8px;}
.season-band{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;}
.season-cell{border:1px solid var(--rule);border-radius:4px;padding:8px;text-align:center;background:var(--paper-2);}
.season-cell .sv{font-family:var(--serif);font-size:22px;}
.season-cell .sl{font-variant:small-caps;letter-spacing:.08em;font-size:11px;color:var(--ink-2);}
/* field-notes page — sanctioned watercolor zone */
.notes-page{position:relative;border:1px solid var(--rule);border-radius:4px;padding:16px 16px 18px;margin:14px 0;
  background:var(--paper);overflow:hidden;}
.notes-page::before{content:"";position:absolute;inset:0;opacity:.16;pointer-events:none;

<div id="updateBanner" role="status">
  <span>A new version is available.</span>
  <button id="updateBtn" type="button">Tap to update</button>
</div>

<div id="app">
  <div class="topbar">
    <div>
      <h1 id="topTitle">Starling Field Journal</h1>
      <div class="sub" id="topSub">Log a sighting</div>
    </div>
    <button class="iconbtn" id="gearBtn" aria-label="Settings"><svg class="ico"><use href="#ui-gear"/></svg></button>
  </div>

  <!-- ===== LOG ===== -->
  <section id="screen-log" class="screen active">
    <div id="editBanner" class="edit-banner" style="display:none">
      <span>Editing a sighting</span>
      <button class="act ghost" id="cancelEdit" style="min-height:34px;padding:5px 12px">Cancel</button>
    </div>

    <div class="section-label">Species</div>
    <div class="spwrap" id="speciesPicker"></div>

    <div class="section-label">Where</div>
    <div class="chips" id="spotChips"></div>
    <div class="placename" id="placeNameWrap" style="display:none">
      <label class="fld" for="placeNameInput">Place name (editable)</label>
      <input type="text" id="placeNameInput" placeholder="backyard, Ben Lomond">
    </div>

    <div class="section-label">When</div>
    <label class="fld" for="dateInput">Date</label>
    <input type="date" id="dateInput">
    <div style="height:12px"></div>
    <div class="seg" id="todSeg">
      <button data-tod="morning"><svg class="ico"><use href="#ui-sunrise"/></svg>Morning</button>
      <button data-tod="afternoon"><svg class="ico"><use href="#ui-sun"/></svg>Afternoon</button>
      <button data-tod="evening"><svg class="ico"><use href="#ui-sunset"/></svg>Evening</button>
      <button data-tod="night"><svg class="ico"><use href="#ui-moon"/></svg>Night</button>
    </div>
    <button class="disclosure" id="exactTimeToggle">+ exact time</button>
    <div id="exactTimeWrap" style="display:none"><input type="time" id="exactTimeInput"></div>

    <div class="section-label">How many</div>
    <div class="stepper">
      <button id="countMinus" aria-label="Decrease count">−</button>
      <div class="val empty" id="countVal">—</div>
      <button id="countPlus" aria-label="Increase count">+</button>
    </div>
    <span class="small-note" style="margin-left:10px">optional</span>

    <div class="section-label">Photos</div>
    <label class="filebtn">Add photo(s)<input type="file" id="photoInput" accept="image/*" multiple></label>
    <div class="thumbs" id="photoThumbs"></div>
    <div id="exifChip"></div>

    <div class="section-label">Notes</div>
    <textarea id="notesInput" placeholder="distant, on the ridge trail…"></textarea>

    <button class="act save-btn" id="saveBtn">Save sighting</button>
    <p class="small-note" style="text-align:center;margin-top:10px">Weather is fetched automatically after saving.</p>
  </section>

  <!-- ===== JOURNAL ===== -->
  <section id="screen-journal" class="screen">
    <div id="backupNudge"></div>
    <div id="onThisDayJournal"></div>
    <div id="filterBar-journal" class="filter-bar"></div>
    <div id="journalList"></div>
    <div id="journalSentinel" style="height:1px"></div>
  </section>

  <!-- ===== MAP ===== -->
  <section id="screen-map" class="screen">
    <div id="filterBar-map" class="filter-bar"></div>
    <div id="mapNotice"></div>
    <div id="leafletMap"></div>
    <div class="map-foot"><label class="chk"><input type="checkbox" id="showSpots"> Show saved spots</label>
      <span class="small-note" id="mapCount"></span></div>
  </section>

  <!-- ===== ALMANAC (placeholder) ===== -->
  <section id="screen-almanac" class="screen">
    <div id="onThisDayAlmanac"></div>
    <div class="seg" id="almanacSeg">
      <button data-al="heatmap" class="sel">Heatmap</button>
      <button data-al="frequency">Frequency</button>
      <button data-al="notes">Field Notes</button>
    </div>
    <div id="almanacBody"></div>
  </section>
</div>

<nav class="tabbar" id="tabbar">
  <button data-tab="log" class="active"><svg class="ico"><use href="#ui-log"/></svg>Log</button>
  <button data-tab="journal"><svg class="ico"><use href="#ui-journal"/></svg>Journal</button>
  <button data-tab="map"><svg class="ico"><use href="#ui-map"/></svg>Map</button>
  <button data-tab="almanac"><svg class="ico"><use href="#ui-almanac"/></svg>Almanac</button>
</nav>

<div class="sheet-scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grip"></div><div id="sheetBody"></div></div>

<div id="toast"><span id="toastMsg"></span><button id="toastAction" type="button">Undo</button></div>
<div class="zoom-overlay" id="zoom"><img id="zoomImg" alt="photo"></div>

<script>
"use strict";
/* Keep APP_VERSION in step with CACHE_VERSION in sw.js. */
const APP_VERSION='v0.6.3';
const SCHEMA_VERSION=1;

/* ---------------- tiny helpers ---------------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const el=(t,props={},kids=[])=>{const n=document.createElement(t);
  for(const k in props){if(k==='class')n.className=props[k];else if(k==='html')n.innerHTML=props[k];
    else if(k==='text')n.textContent=props[k];else if(k.startsWith('on'))n.addEventListener(k.slice(2),props[k]);
    else n.setAttribute(k,props[k]);}
  (Array.isArray(kids)?kids:[kids]).forEach(c=>c&&n.appendChild(typeof c==='string'?document.createTextNode(c):c));return n;};
const uuid=()=>(crypto.randomUUID?crypto.randomUUID():'id-'+Math.random().toString(36).slice(2)+Date.now());
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const nowISO=()=>new Date().toISOString();
const pad=n=>String(n).padStart(2,'0');
const todayLocal=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
const isoToLocalYMD=iso=>{const d=new Date(iso);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
const parseLocal=iso=>{const[y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d);};
const fmtDayHead=iso=>new Intl.DateTimeFormat('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(parseLocal(iso));
const fmtDate=iso=>new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',year:'numeric'}).format(parseLocal(iso));
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS=['mammal','bird','reptile-amphibian','insect','plant','other'];
const CAT_LABEL={mammal:'Mammals',bird:'Birds','reptile-amphibian':'Reptiles & Amphibians',insect:'Insects & Inverts',plant:'Plants & Fungi',other:'Other'};
const TOD_ICON={morning:'ui-sunrise',afternoon:'ui-sun',evening:'ui-sunset',night:'ui-moon'};
const TOD_LABEL={morning:'Morning',afternoon:'Afternoon',evening:'Evening',night:'Night'};

/* ---------------- default species seed (§5) ---------------- */
const SEED=[
  ['Coyote','mammal','coyote'],['Bobcat','mammal','bobcat'],['Mountain Lion','mammal','mammal'],
  ['Gray Fox','mammal','fox'],['Raccoon','mammal','raccoon'],['Striped Skunk','mammal','skunk'],
  ['Black-tailed Deer','mammal','deer'],['Western Gray Squirrel','mammal','squirrel'],
  ['Brush Rabbit','mammal','rabbit'],['Dusky-footed Woodrat','mammal','mammal'],['Virginia Opossum','mammal','mammal'],
  ["Steller's Jay",'bird','jay'],['Acorn Woodpecker','bird','woodpecker'],['Red-tailed Hawk','bird','hawk'],
  ['Wild Turkey','bird','turkey'],['California Quail','bird','quail'],['Great Horned Owl','bird','owl'],
  ['Turkey Vulture','bird','bird'],["Anna's Hummingbird",'bird','bird'],['Band-tailed Pigeon','bird','bird'],
  ['Dark-eyed Junco','bird','bird'],['Chestnut-backed Chickadee','bird','bird'],['Common Raven','bird','bird'],
  ['Western Fence Lizard','reptile-amphibian','lizard'],['California Newt','reptile-amphibian','newt'],
  ['Pacific Chorus Frog','reptile-amphibian','frog'],['Gopher Snake','reptile-amphibian','snake'],
  ['California Kingsnake','reptile-amphibian','snake'],['Alligator Lizard','reptile-amphibian','lizard'],
  ['Ensatina','reptile-amphibian','newt'],['Rough-skinned Newt','reptile-amphibian','newt'],
  ['Banana Slug','insect','slug'],['Monarch Butterfly','insect','butterfly'],
  ['Western Tiger Swallowtail','insect','butterfly'],['California Sister','insect','butterfly'],
  ['Velvet Ant','insect','insect'],['Jerusalem Cricket','insect','insect'],
  ['Coast Redwood','plant','redwood'],['Pacific Madrone','plant','madrone'],['Tanoak','plant','plant'],
  ['California Bay Laurel','plant','plant'],['Douglas Fir','plant','redwood'],['Big Leaf Maple','plant','plant'],
  ['Western Sword Fern','plant','fern'],['Redwood Sorrel','plant','plant'],
  ['Fly Agaric','plant','mushroom'],['Turkey Tail','plant','mushroom']
];

/* ---------------- IndexedDB data layer (§6.1) ---------------- */
const DB_NAME='fieldJournal';
let _db=null;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,SCHEMA_VERSION);
    req.onupgradeneeded=(e)=>{
      const db=req.result;const oldV=e.oldVersion;
      /* migration scaffold — switch on oldVersion for future versions */
      if(oldV<1){
        db.createObjectStore('meta',{keyPath:'key'});
        db.createObjectStore('species',{keyPath:'id'});
        db.createObjectStore('spots',{keyPath:'id'});
        db.createObjectStore('sightings',{keyPath:'id'});
        db.createObjectStore('photos',{keyPath:'id'});
      }
      /* future: if(oldV<2){ ... } */
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
function tx(store,mode){return _db.transaction(store,mode).objectStore(store);}

function idbAll(store){return new Promise((res,rej)=>{const r=tx(store,'readonly').getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});}
function idbPut(store,val){return new Promise((res,rej)=>{const t=_db.transaction(store,'readwrite');t.objectStore(store).put(val);t.oncomplete=()=>res(val);t.onerror=()=>rej(t.error);});}

function idbClear(store){return new Promise((res,rej)=>{const t=_db.transaction(store,'readwrite');t.objectStore(store).clear();t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
// Bulk variants: one transaction (one commit) for N records — per-record
// idbPut/idbDel loops pay a full commit each, which is seconds at N=500.
function idbPutAll(store,vals){return new Promise((res,rej)=>{const t=_db.transaction(store,'readwrite'),os=t.objectStore(store);vals.forEach(v=>os.put(v));t.oncomplete=()=>res(vals);t.onerror=()=>rej(t.error);});}
function idbDelAll(store,keys){return new Promise((res,rej)=>{const t=_db.transaction(store,'readwrite'),os=t.objectStore(store);keys.forEach(k=>os.delete(k));t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}

/* ---------------- app state ---------------- */
// form.spotId: undefined = untouched (eligible for last-used preselect),
//              null = explicitly "No location", string = a chosen spot id.
// form.coords + form.locKind ('gps'|'pin') hold an un-saved GPS/pin location.
const state={meta:null,species:[],spots:[],sightings:[],
  form:{speciesId:null,spotId:undefined,coords:null,locKind:null,placeName:null,dateISO:todayLocal(),timeOfDay:null,exactTime:null,count:null,notes:'',photos:[]},
  editingId:null,journalWindow:60,searchTerm:''};

/* ---------------- moon phase (§9.2) ---------------- */
const MOON_NAMES=['New Moon','Waxing Crescent','First Quarter','Waxing Gibbous','Full Moon','Waning Gibbous','Last Quarter','Waning Crescent'];
function computeMoon(dateISO,exactTime){
  const[y,m,d]=dateISO.split('-').map(Number);
  let hh=12,mm=0;if(exactTime){const p=exactTime.split(':');hh=+p[0];mm=+p[1];}
  // Julian Day (UT approximated by local; fine at this granularity)
  let Y=y,M=m;if(M<=2){Y-=1;M+=12;}
  const A=Math.floor(Y/100),B=2-A+Math.floor(A/4);
  const JD=Math.floor(365.25*(Y+4716))+Math.floor(30.6001*(M+1))+d+B-1524.5+(hh+mm/60)/24;
  const SYN=29.530588853, NEW=2451550.1;

}
function moonGlyph(illum,waxing){ // small SVG moon showing illumination
  const r=10,cx=14,cy=14;const off=(1-illum*2)*r; // -r..r
  let rx=Math.abs(off);if(rx<0.1)rx=0.1;           // avoid rx=0 arcs some renderers drop
  const sweepInner=(off<0)?(waxing?1:0):(waxing?0:1);
  return `<svg class="ico" viewBox="0 0 28 28"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="currentColor" stroke-width="1.4"/>`+
    `<path d="M14 4 A10 10 0 0 ${waxing?1:0} 14 24 A${rx} 10 0 0 ${sweepInner} 14 4 Z" class="fill"/></svg>`;
}

/* ---------------- icon resolver ---------------- */
function hasSymbol(id){return !!document.getElementById('ic-'+id);}
function speciesIcon(sp,cls){
  cls=cls||'ico';
  if(sp&&sp.customIcon&&sp.customIcon.type==='emoji')
    return `<span class="emoji-ico" style="font-size:1.3em">${esc(sp.customIcon.value)}</span>`;
  let id=sp?sp.iconId:'other';
  if(!hasSymbol(id))id=(sp&&CATS.includes(sp.category))?sp.category:'other';
  return `<svg class="${cls}"><use href="#ic-${id}"/></svg>`;
}
const speciesById=id=>state.species.find(s=>s.id===id);
const spotById=id=>state.spots.find(s=>s.id===id);

/* ---------------- init / hydrate ---------------- */
async function init(){
  try{_db=await openDB();}
  catch(err){return showFatal('Could not open the journal database. '+err);}
  let meta=await idbGet('meta','meta');
  if(!meta){ // first launch — seed
    meta={key:'meta',schemaVersion:SCHEMA_VERSION,createdAt:nowISO(),lastBackupAt:null,
      settings:{units:'imperial',theme:'sepia',backupNudgeSnoozeUntil:null,persistResult:null}};
    await idbPut('meta',meta);
    for(const[name,category,iconId]of SEED){
      await idbPut('species',{id:uuid(),name,category,iconId,customIcon:null,isCustom:false,isArchived:false,createdAt:nowISO()});
    }
    if(navigator.storage&&navigator.storage.persist){
      try{meta.settings.persistResult=await navigator.storage.persist();await idbPut('meta',meta);}catch(e){}
    }
  }
  state.meta=meta;
  state.species=await idbAll('species');
  state.spots=await idbAll('spots');
  state.sightings=await idbAll('sightings');
  await upgradeSeedIcons();   // existing installs adopt newly-drawn species icons
  wireUI();
  routeTo(location.hash||'#log');
  renderLog();
  initSW();
  processGeocodeQueue();   // backfill any place names that couldn't resolve offline
  processWeatherQueue();   // backfill weather for anything logged offline
}
// §4.1: existing installs seeded before the marquee icons existed have generic
// category iconIds baked into IndexedDB. Remap default (non-custom) species to
// the SEED's current mapping by name; custom species and emoji icons untouched.
async function upgradeSeedIcons(){
  const seedIcon=new Map(SEED.map(([name,,iconId])=>[name.toLowerCase(),iconId]));
  const changed=[];
  for(const sp of state.species){
    if(sp.isCustom||sp.customIcon)continue;
    const want=seedIcon.get((sp.name||'').toLowerCase());
    if(want&&sp.iconId!==want){sp.iconId=want;changed.push(sp);}
  }
  if(changed.length)await idbPutAll('species',changed);
}
function showFatal(msg){
  document.getElementById('app').innerHTML=
    `<div class="empty" style="padding-top:80px"><p>${esc(msg)}</p>`+
    `<button class="act" id="fatalImport">Import a backup</button></div>`;
  const b=document.getElementById('fatalImport');if(b)b.addEventListener('click',doImport);
}

  map:['Map','Where you’ve looked'],almanac:['Almanac','Seasons & summaries']};
function routeTo(hash){
  let tab=(hash||'#log').replace('#','').split('/')[0];
  if(!TAB_TITLES[tab])tab='log';
  $$('.screen').forEach(s=>s.classList.remove('active'));
  const scr=document.getElementById('screen-'+tab);if(scr)scr.classList.add('active');
  $$('.tabbar button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  $('#topTitle').textContent=TAB_TITLES[tab][0];
  $('#topSub').textContent=TAB_TITLES[tab][1];

  if(tab==='journal')renderJournal();

  if(tab==='almanac')renderAlmanac();
}

function recentSpeciesIds(n){
  const seen=[],order=[...state.sightings].sort((a,b)=>b.createdAt<a.createdAt?-1:1);
  for(const s of order){if(!seen.includes(s.speciesId)&&speciesById(s.speciesId)&&!speciesById(s.speciesId).isArchived){seen.push(s.speciesId);}if(seen.length>=n)break;}
  return seen;
}

function renderSpeciesRecent(){

function renderSpeciesResults(){

    const list=active.filter(s=>s.category===cat).sort((a,b)=>a.name.localeCompare(b.name));

function orderedSpots(){

    if(la!==lb)return la<lb?1:-1;return(b.useCount||0)-(a.useCount||0);});

function renderSpotChips(){

function todOfHour(h){if(h>=5&&h<12)return'morning';if(h>=12&&h<17)return'afternoon';if(h>=17&&h<21)return'evening';return'night';}

let isSaving=false;
async function saveSighting(){
  if(isSaving)return;                       // guard against double-tap duplicates
  const f=state.form;
  if(!f.speciesId){toast('Pick a species first',null);return;}
  isSaving=true;const _btn=$('#saveBtn');if(_btn)_btn.disabled=true;
  try{await _saveSighting(f);}
  finally{isSaving=false;const b=$('#saveBtn');if(b)b.disabled=false;}
}
async function _saveSighting(f){
  // Deep future-date guard: the input max/clamp only cover manual entry — a
  // legacy/imported future date loaded via Edit would otherwise re-save as-is.
  if(f.dateISO>todayLocal())f.dateISO=todayLocal();
  const sp=speciesById(f.speciesId);
  const spot=f.spotId?spotById(f.spotId):null;
  let loc;   // NB: do NOT name this `location` — it shadows window.location.
  if(spot){loc={kind:'spot',spotId:spot.id,lat:spot.lat??null,lng:spot.lng??null,
    placeName:(f.placeName!=null?f.placeName:spot.name)};}
  else if(f.coords){loc={kind:(f.locKind||'pin'),spotId:null,lat:f.coords.lat,lng:f.coords.lng,
    placeName:(f.placeName!=null?f.placeName:null)};}
  else if(f.placeName){loc={kind:'none',spotId:null,lat:null,lng:null,placeName:f.placeName};}
  else{loc={kind:'none',spotId:null,lat:null,lng:null,placeName:null};}
  const moon=computeMoon(f.dateISO,f.exactTime);
  const formPhotos=f.photos||[];                 // in-memory {id,thumb,full,width,height,persisted}
  const photoIds=formPhotos.map(p=>p.id);
  const prevPhotoIds=(state.editingId&&state.sightings.find(s=>s.id===state.editingId)||{}).photoIds||[];
  let rec;
  if(state.editingId){
    rec=state.sightings.find(s=>s.id===state.editingId);
    const dateChanged=rec.dateISO!==f.dateISO||rec.exactTime!==f.exactTime;
    const locChanged=JSON.stringify(rec.location)!==JSON.stringify(loc);
    rec=Object.assign({},rec,{dateISO:f.dateISO,timeOfDay:f.timeOfDay,exactTime:f.exactTime,
      speciesId:f.speciesId,location:loc,count:f.count,notes:f.notes||'',moonPhase:moon,
      photoIds,updatedAt:nowISO()});
    // re-fetch weather if the date or location changed; clear it if the location
    // (and thus any coordinates) was removed entirely.
    if((dateChanged||locChanged)&&loc.lat!=null){rec.weather=null;rec.weatherPending=true;}
    else if(locChanged&&loc.lat==null){rec.weather=null;rec.weatherPending=false;delete rec.weatherTries;}
  }else{
    rec={id:uuid(),dateISO:f.dateISO,timeOfDay:f.timeOfDay,exactTime:f.exactTime,speciesId:f.speciesId,
      location:loc,count:f.count,notes:f.notes||'',weather:null,weatherPending:(loc.lat!=null),moonPhase:moon,
      photoIds,createdAt:nowISO(),updatedAt:nowISO()};
  }
  try{await idbPut('sightings',rec);}
  catch(err){toast('Save failed — storage error',null);console.error(err);return;}
  // persist newly-captured photos; delete any the user removed while editing
  for(const p of formPhotos){if(!p.persisted){
    await idbPut('photos',{id:p.id,sightingId:rec.id,thumb:p.thumb,full:p.full,width:p.width,height:p.height,createdAt:nowISO()});}}
  for(const oldId of prevPhotoIds){if(!photoIds.includes(oldId))await idbDel('photos',oldId).catch(()=>{});}
  // update in-memory
  const i=state.sightings.findIndex(s=>s.id===rec.id);
  if(i>=0)state.sightings[i]=rec;else state.sightings.push(rec);
  // update spot recency
  if(spot){spot.lastUsedAt=nowISO();spot.useCount=(spot.useCount||0)+1;await idbPut('spots',spot);}
  // a GPS/pin location saved without a resolved name (offline) → queue backfill
  let enqueued=false;
  if(loc.lat!=null&&!loc.placeName){await enqueueGeocode(rec.id);enqueued=true;}
  const wasEditing=state.editingId;
  resetForm();
  if(wasEditing){location.hash='#journal';toast('Updated ✓ '+sp.name,null);}
  else{toast('Logged ✓ '+sp.name,{label:'Undo',fn:()=>undoSave(rec.id,spot?spot.id:null,rec.photoIds)});}
  // kick enrichment (non-blocking): weather + any geocode backfill
  if(rec.weatherPending)fetchWeatherFor(rec.id);
  if(enqueued)processGeocodeQueue();
}
async function undoSave(id,spotId,photoIds){
  await idbDel('sightings',id);
  state.sightings=state.sightings.filter(s=>s.id!==id);
  if(photoIds)for(const pid of photoIds)await idbDel('photos',pid).catch(()=>{});
  if(spotId){const sp=spotById(spotId);if(sp&&sp.useCount>0){sp.useCount--;await idbPut('spots',sp);}}
  hideToast();renderLog();
}
function resetForm(){
  const keepSpot=orderedSpots()[0];
  state.editingId=null;state.searchTerm='';
  revokePhotoUrls();
  state.form={speciesId:null,spotId:keepSpot?keepSpot.id:undefined,coords:null,locKind:null,placeName:null,
    dateISO:todayLocal(),timeOfDay:null,exactTime:null,count:null,notes:'',photos:[]};
  renderLog();
}

function sortedSightings(){return[...state.sightings].sort((a,b)=>{
  if(a.dateISO!==b.dateISO)return a.dateISO<b.dateISO?1:-1;
  return(a.createdAt<b.createdAt)?1:-1;});}
// journalItems() is wrapped by the shared filter bar (Phase 2); base = all.
function journalItems(){return applyFilters(sortedSightings());}
let jState={rendered:0,curDay:null,items:[]};
// Full render — only on data change / entering the tab / filter change.
function renderJournal(){
  renderBackupNudge();renderOnThisDay('onThisDayJournal');renderFilterBar('journal');
  const list=$('#journalList');list.innerHTML='';revokeJournalPhotoUrls();
  jState={rendered:0,curDay:null,items:journalItems()};
  if(!jState.items.length){
    list.appendChild(el('div',{class:'empty',html:
      `<svg class="ico"><use href="#ui-book"/></svg><p>${filtersActive()?'No sightings match these filters.':'No sightings yet — the journal awaits.'}</p>`+
      (filtersActive()?`<button class="act" onclick="clearFilters()">Clear filters</button>`
                      :`<button class="act" onclick="location.hash='#log'">Log your first sighting</button>`)}));
    return;
  }
  appendJournalRows(state.journalWindow);
}
// Append only the new slice — never nuke+rebuild on scroll (avoids scroll jump / O(n²)).
function appendJournalRows(upTo){
  const list=$('#journalList');const items=jState.items;const end=Math.min(upTo,items.length);
  for(let i=jState.rendered;i<end;i++){
    const s=items[i];
    if(s.dateISO!==jState.curDay){jState.curDay=s.dateISO;list.appendChild(el('div',{class:'day-head',text:fmtDayHead(s.dateISO)}));}
    list.appendChild(entryRow(s));
  }
  jState.rendered=end;
}
function entryRow(s){
  const sp=speciesById(s.speciesId);
  const row=el('div',{class:'entry',onclick:()=>openDetail(s.id)});
  const place=s.location&&s.location.placeName?s.location.placeName:(s.location&&s.location.kind==='none'?'':'');
  const meta=[];
  if(place)meta.push(esc(place));
  if(s.count!=null)meta.push(`<span class="count-badge">×${s.count}</span>`);
  let todGlyph=s.timeOfDay?`<svg class="ico"><use href="#${TOD_ICON[s.timeOfDay]}"/></svg>`:'';
  const wx=s.weather?`<span class="wx-line" style="gap:4px">${weatherGlyph(s.weather.wmoCode)}</span>`:'';
  row.innerHTML=`<div class="ico-wrap">${speciesIcon(sp)}</div>
    <div class="body"><div class="nm">${esc(sp?sp.name:'Unknown')}</div>
    <div class="meta">${meta.join(' ')} ${todGlyph} ${wx}</div>
    ${s.notes?`<div class="snip">${esc(s.notes)}</div>`:''}</div>`;
  if(s.photoIds&&s.photoIds.length){
    const img=el('img',{class:'ephoto',alt:''});row.appendChild(img);loadRowThumb(img,s.photoIds[0]);
  }
  return row;
}
// infinite scroll
let jObserver=null;
function setupJournalObserver(){
  const sentinel=$('#journalSentinel');if(!sentinel||jObserver)return;
  jObserver=new IntersectionObserver(es=>{
    es.forEach(e=>{if(e.isIntersecting){
      if(state.journalWindow<jState.items.length){state.journalWindow+=60;appendJournalRows(state.journalWindow);}
    }});
  },{rootMargin:'400px'});
  jObserver.observe(sentinel);
}

/* ---- sighting detail (§7.2) ---- */
function openDetail(id){
  const s=state.sightings.find(x=>x.id===id);if(!s)return;
  const sp=speciesById(s.speciesId);
  const m=s.moonPhase;
  const waxing=m?m.phase<0.5:true;
  const timeStr=[s.timeOfDay?TOD_LABEL[s.timeOfDay]:null,s.exactTime||null].filter(Boolean).join(' · ')||'—';
  let weatherHtml='—';
  if(s.weather){const wt=weatherText(s.weather);weatherHtml=`<span class="wx-line">${weatherGlyph(s.weather.wmoCode)}<span>${esc(wt)}</span></span>`;}
  else if(s.weatherPending&&s.location&&s.location.lat!=null)weatherHtml='<span class="small-note">fetching…</span>';
  const rows=[
    ['Date',fmtDate(s.dateISO)],
    ['Time',timeStr],

async function deleteSighting(id){
  const s=state.sightings.find(x=>x.id===id);
  if(s&&s.photoIds)for(const pid of s.photoIds)await idbDel('photos',pid).catch(()=>{});
  await idbDel('sightings',id);
  state.sightings=state.sightings.filter(x=>x.id!==id);
}
async function loadIntoForm(s){

    spotId:loc.spotId?loc.spotId:null,

}

/* ---- backup nudge (§6.2) ---- */
function renderBackupNudge(){
  const w=$('#backupNudge');w.innerHTML='';
  const m=state.meta;const snooze=m.settings.backupNudgeSnoozeUntil;
  if(snooze&&Date.now()<snooze)return;
  const last=m.lastBackupAt?Date.parse(m.lastBackupAt):0;
  const daysOld=last?((Date.now()-last)/864e5):Infinity;
  const newSince=state.sightings.filter(s=>!last||Date.parse(s.createdAt)>last).length;
  if((last===0||daysOld>30)&&newSince>=5){
    const b=el('div',{class:'warn-banner'});
    b.innerHTML=`<span>It’s been a while — back up your journal.</span>`;
    const x=el('button',{type:'button',title:'Snooze 7 days',onclick:async()=>{
      m.settings.backupNudgeSnoozeUntil=Date.now()+7*864e5;await idbPut('meta',m);w.innerHTML='';}},['×']);
    b.appendChild(x);
    b.addEventListener('click',e=>{if(e.target===x)return;openSettings();});
    w.appendChild(b);
  }
}

async function seedTestData(n){
  const active=state.species.filter(s=>!s.isArchived);
  if(!active.length)return 0;
  const spots=state.spots.slice();
  const tods=[null,'morning','afternoon','evening','night'];
  const noteBank=['distant, on the ridge trail','brief look before it moved off','heard, not seen',
    'a pair together','juvenile','crossing the fire road','feeding quietly','calling at dusk'];
  const today=new Date(),recs=[];
  for(let i=0;i<n;i++){
    const sp=active[Math.floor(Math.random()*active.length)];
    const d=new Date(today.getFullYear(),today.getMonth(),today.getDate()-Math.floor(Math.random()*3*365));
    const dateISO=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    // location: usually a saved spot, sometimes a loose pin, sometimes none
    const spot=spots.length&&Math.random()<0.6?spots[Math.floor(Math.random()*spots.length)]:null;
    let loc;
    if(spot)loc={kind:'spot',spotId:spot.id,lat:spot.lat??null,lng:spot.lng??null,placeName:spot.name};
    else if(Math.random()<0.4)loc={kind:'pin',spotId:null,lat:37.0+Math.random()*0.3,lng:-122.2+Math.random()*0.3,placeName:'Test Ridge'};
    else loc={kind:'none',spotId:null,lat:null,lng:null,placeName:null};
    const created=new Date(d.getTime()+Math.random()*36e5).toISOString();
    recs.push({id:uuid(),dateISO,timeOfDay:tods[Math.floor(Math.random()*tods.length)],exactTime:null,
      speciesId:sp.id,location:loc,count:Math.random()<0.4?1+Math.floor(Math.random()*4):null,
      notes:Math.random()<0.4?noteBank[Math.floor(Math.random()*noteBank.length)]:'',
      weather:null,weatherPending:false,moonPhase:computeMoon(dateISO,null),  // weatherPending:false → never hits the weather API
      photoIds:[],seeded:true,createdAt:created,updatedAt:created});
  }
  await idbPutAll('sightings',recs);
  state.sightings.push(...recs);
  return recs.length;
}
async function deleteSeededData(){
  const doomed=state.sightings.filter(s=>s.seeded);
  // A seeded record edited during testing may have gained photos — clean those
  // up like deleteSighting does, or the blobs are orphaned in IDB forever.
  const photoIds=[].concat(...doomed.map(s=>s.photoIds||[]));
  if(photoIds.length)await idbDelAll('photos',photoIds).catch(()=>{});
  await idbDelAll('sightings',doomed.map(s=>s.id));
  state.sightings=state.sightings.filter(s=>!s.seeded);
  return doomed.length;
}

  }

}
async function buildExport(withPhotos){

    meta,species:state.species,spots:state.spots,sightings:state.sightings,photos};
}
function blobToB64(blob){return new Promise((res)=>{if(!blob)return res(null);const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(blob);});}
async function doExport(withPhotos){

function openImportChoice(data){
  const counts=`${data.sightings.length} sightings · ${(data.species||[]).length} species · ${(data.spots||[]).length} spots`;
  // "Fresh install" = nothing logged yet and only the default seed present.

  const hint=fresh?`<div class="warn-banner"><span>This looks like a fresh install — use <b>Replace</b> to restore a backup cleanly. Merge is for combining two journals.</span></div>`:'';
  openSheet(`<h2>Import backup</h2><p class="sub">${counts}</p>${hint}
    <div class="field-block"><button class="act ${fresh?'':''}" id="impReplace" style="width:100%">Replace everything (restore)</button></div>
    <div class="field-block"><button class="act ghost" id="impMerge" style="width:100%">Merge (add new, keep existing)</button></div>
    <div id="impConfirm"></div>
    <div class="btnrow"><button class="act ghost" id="impCancel">Cancel</button></div>`);
  $('#impCancel').onclick=closeSheet;
  $('#impMerge').onclick=()=>runImport(data,'merge');
  $('#impReplace').onclick=()=>{

      <span>This wipes your current journal. Type <b>REPLACE</b> to confirm.</span></div>
      <input type="text" id="impWord" placeholder="REPLACE" style="margin-bottom:10px">
      <button class="act danger" id="impGo" style="width:100%">Replace now</button>`;
    $('#impGo').onclick=()=>{if(($('#impWord').value||'').trim().toUpperCase()==='REPLACE')runImport(data,'replace');else $('#impWord').focus();};
  };
}
async function b64ToBlob(d){if(!d)return null;const r=await fetch(d);return await r.blob();}
function defaultMeta(){return{key:'meta',schemaVersion:SCHEMA_VERSION,createdAt:nowISO(),lastBackupAt:null,
  settings:{units:'imperial',theme:'sepia',backupNudgeSnoozeUntil:null,persistResult:null}};}
async function runImport(data,mode){
  try{
    // idRemap: importedSpeciesId -> existingSpeciesId (used to dedupe default
    // seed species by name so a fresh-install Merge doesn't double the seed).
    const idRemap={};
    if(mode==='replace'){
      for(const st of['meta','species','spots','sightings','photos'])await idbClear(st);
      // Guard: a meta-less backup must still leave a valid meta record behind,
      // or renderBackupNudge() dereferences undefined.settings.
      await idbPut('meta',data.meta?Object.assign({},data.meta,{key:'meta'}):defaultMeta());
      for(const r of(data.species||[]))await idbPut('species',r);
      for(const r of(data.spots||[]))await idbPut('spots',r);
      for(const r of(data.sightings||[]))await idbPut('sightings',r);
    }else{ // merge
      if(data.meta&&!state.meta)await idbPut('meta',Object.assign({},data.meta,{key:'meta'}));
      const exSpById=new Set(state.species.map(s=>s.id));
      const exDefaultByName=new Map(state.species.filter(s=>!s.isCustom).map(s=>[s.name.toLowerCase(),s.id]));
      for(const r of(data.species||[])){
        if(exSpById.has(r.id))continue;
        if(!r.isCustom){                              // dedupe seed defaults by name
          const ex=exDefaultByName.get((r.name||'').toLowerCase());
          if(ex){idRemap[r.id]=ex;continue;}
        }
        await idbPut('species',r);
      }
      const exSpot=new Set(state.spots.map(s=>s.id));
      for(const r of(data.spots||[])){if(exSpot.has(r.id))continue;await idbPut('spots',r);}
      const exSi=new Set(state.sightings.map(s=>s.id));
      for(let r of(data.sightings||[])){
        if(exSi.has(r.id))continue;
        if(idRemap[r.speciesId])r=Object.assign({},r,{speciesId:idRemap[r.speciesId]});
        await idbPut('sightings',r);
      }
    }
    if(data.photos&&data.photos.length){
      const exPh=new Set((await idbAll('photos')).map(p=>p.id));
      for(const p of data.photos){if(mode==='merge'&&exPh.has(p.id))continue;
        await idbPut('photos',{id:p.id,sightingId:p.sightingId,width:p.width,height:p.height,createdAt:p.createdAt,
          thumb:await b64ToBlob(p.thumb),full:await b64ToBlob(p.full)});}
    }
    // rehydrate
    state.meta=await idbGet('meta','meta')||defaultMeta();
    state.species=await idbAll('species');state.spots=await idbAll('spots');state.sightings=await idbAll('sightings');
    closeSheet();resetForm();renderJournal();
    toast(mode==='replace'?'Journal replaced':'Backup merged',null);
  }catch(err){console.error(err);toast('Import failed',null);}
}

let toastTimer=null;
function toast(msg,action){
  clearTimeout(toastTimer);
  $('#toastMsg').textContent=msg;
  const btn=$('#toastAction');

  else btn.style.display='none';

  toastTimer=setTimeout(hideToast,action?5000:2600);
}

/* ---- shared filter bar (Journal + Map, §7.2/§7.3) ---- */
const filters={species:new Set(),categories:new Set(),spotId:null,from:'',to:''};
let filtersOpen=false;
function filterCount(){return filters.species.size+filters.categories.size+(filters.spotId?1:0)+((filters.from||filters.to)?1:0);}
function filtersActive(){return filterCount()>0;}
function applyFilters(list){
  if(!filtersActive())return list;
  return list.filter(s=>{
    if(filters.species.size&&!filters.species.has(s.speciesId))return false;
    if(filters.categories.size){const sp=speciesById(s.speciesId);if(!sp||!filters.categories.has(sp.category))return false;}
    if(filters.spotId&&!(s.location&&s.location.spotId===filters.spotId))return false;
    if(filters.from&&s.dateISO<filters.from)return false;
    if(filters.to&&s.dateISO>filters.to)return false;
    return true;
  });
}
function currentTab(){return(location.hash||'#log').replace('#','').split('/')[0];}
function refreshActiveFilterView(){

  else{state.journalWindow=60;renderJournal();}
}
function clearFilters(){filters.species.clear();filters.categories.clear();filters.spotId=null;filters.from='';filters.to='';refreshActiveFilterView();}

    onclick:()=>toggleSet(filters.categories,c)},[CAT_LABEL[c]])));

  if(speciesPresent.length){

/* ---- geocoding — Nominatim (§9.5), best-effort ---- */
const NOMINATIM='https://nominatim.openstreetmap.org';
async function reverseGeocode(lat,lng){
  const u=`${NOMINATIM}/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=14&addressdetails=1`;
  const r=await fetch(u,{headers:{'Accept':'application/json'}});
  if(!r.ok)throw new Error('reverse '+r.status);
  const j=await r.json();const a=j.address||{};
  const place=a.neighbourhood||a.suburb||a.hamlet||a.village||a.town||a.city||a.locality||'';
  const region=a.county||a.state_district||a.state||'';
  const name=[place,region].filter(Boolean).join(', ');
  return name||(j.display_name?j.display_name.split(',').slice(0,2).join(',').trim():null);
}
let searchTimer=null,searchSeq=0;
function debounceSearch(q,cb){
  clearTimeout(searchTimer);
  const seq=++searchSeq;                       // ignore stale (out-of-order) responses
  searchTimer=setTimeout(async()=>{            // ≥1s throttle per Nominatim policy
    try{const r=await fetch(`${NOMINATIM}/search?format=jsonv2&q=${encodeURIComponent(q)}&limit=5`,{headers:{'Accept':'application/json'}});
      if(seq!==searchSeq)return;               // a newer query superseded this one
      if(!r.ok)return cb([]);const j=await r.json();
      if(seq!==searchSeq)return;
      cb(j.map(x=>({name:x.display_name,lat:+x.lat,lng:+x.lon})));}
    catch(e){if(seq===searchSeq)cb([]);}
  },1100);
}
// Retry queue: sighting ids awaiting a reverse-geocoded place name (offline at save).
function geoQueue(){return (state.meta&&state.meta.settings&&state.meta.settings.geoQueue)||[];}
async function enqueueGeocode(sightingId){
  const q=new Set(geoQueue());q.add(sightingId);
  state.meta.settings.geoQueue=[...q];await idbPut('meta',state.meta);
}
let geoQueueRunning=false;
async function processGeocodeQueue(){
  if(geoQueueRunning||!navigator.onLine)return;
  const q=geoQueue();if(!q.length)return;
  geoQueueRunning=true;
  const remaining=[];let changed=false;let first=true;
  try{
    for(const id of q){
      const s=state.sightings.find(x=>x.id===id);
      if(!s||!s.location||s.location.lat==null||s.location.placeName){continue;}
      if(!first)await sleep(1100);            // stay under Nominatim's 1 req/sec
      first=false;
      try{const nm=await reverseGeocode(s.location.lat,s.location.lng);
        if(nm){s.location.placeName=nm;await idbPut('sightings',s);changed=true;}else remaining.push(id);}
      catch(e){remaining.push(id);}
    }
    state.meta.settings.geoQueue=remaining;await idbPut('meta',state.meta);
  }finally{geoQueueRunning=false;}
  if(changed){if(currentTab()==='journal')renderJournal();if(currentTab()==='map')refreshMap();}
}

/* ---- GPS chip (§9.4) ---- */
function useCurrentLocation(){
  if(!('geolocation'in navigator)){toast('Location unavailable',null);return;}
  toast('Getting location…',null);
  navigator.geolocation.getCurrentPosition(async pos=>{
    hideToast();
    const f=state.form,lat=pos.coords.latitude,lng=pos.coords.longitude;
    f.coords={lat,lng};f.locKind='gps';f.spotId=null;f.placeName=null;
    renderSpotChips();updatePlaceName();
    if(navigator.onLine){try{const nm=await reverseGeocode(lat,lng);if(nm&&f.coords&&f.coords.lat===lat){f.placeName=nm;updatePlaceName();}}catch(e){}}
    toast('Location set'+(f.placeName?` · ${f.placeName}`:''),null);
  },err=>{toast("Couldn't get location — pick a spot or drop a pin",null);},
  {enableHighAccuracy:true,timeout:10000,maximumAge:0});
}

/* ---- pin-drop sheet (§7.1/§9.5) ---- */
let pinMap=null,pinMarker=null,pinLatLng=null;
// Custom pin icon (divIcon) — the default Leaflet marker is a PNG whose path

function pinIcon(){return L.divIcon({html:`<div class="fj-marker fj-pin">◉</div>`,className:'',iconSize:[30,30],iconAnchor:[15,15]});}
function setPinMarker(latlng){if(pinMarker)pinMarker.setLatLng(latlng);else pinMarker=L.marker(latlng,{icon:pinIcon()}).addTo(pinMap);}
function openPinDrop(){
  const start=state.form.coords;

    <div class="pin-search"><input type="text" id="pinSearch" placeholder="Search a place…"><div class="pin-results" id="pinResults"></div></div>
    <div id="pinMap"></div><div id="pinNotice"></div>

      <button class="act ghost" id="pinCancel">Cancel</button></div>`);

    pinMarker=null;if(pinLatLng){setPinMarker(pinLatLng);$('#pinUse').disabled=false;}

  $('#pinSearch').addEventListener('input',e=>{

    if(navigator.onLine){try{const nm=await reverseGeocode(lat,lng);if(nm&&f.coords&&f.coords.lat===lat){f.placeName=nm;updatePlaceName();}}catch(e){}}
  };
}

/* ---- Map screen (§7.3) ---- */
let map=null,markerLayer=null,spotLayer=null,tileLayer=null,tileErrorShown=false,mapReady=false,mapFitted=false;

function popupHtml(s){const sp=speciesById(s.speciesId);

    `<div class="pmeta">${[esc(s.location.placeName||''),fmtDate(s.dateISO),(s.count!=null?'×'+s.count:'')].filter(Boolean).join(' · ')}</div>`+
    `<button type="button">Open detail</button></div>`;}
function refreshMap(){
  renderFilterBar('map');
  if(!mapReady||!map)return;
  markerLayer.clearLayers();
  const all=applyFilters(state.sightings);
  const pts=all.filter(s=>s.location&&s.location.lat!=null&&s.location.lng!=null);
  const bounds=[];
  pts.forEach(s=>{
    const sp=speciesById(s.speciesId);
    const m=L.marker([s.location.lat,s.location.lng],{icon:L.divIcon({html:`<div class="fj-marker">${speciesIcon(sp)}</div>`,className:'',iconSize:[30,30],iconAnchor:[15,15]})});
    m.bindPopup(popupHtml(s),{className:'fj-popup-wrap'});
    m.on('popupopen',ev=>{const b=ev.popup._contentNode&&ev.popup._contentNode.querySelector('button');if(b)b.onclick=()=>{map.closePopup();openDetail(s.id);};});
    markerLayer.addLayer(m);bounds.push([s.location.lat,s.location.lng]);

      const m=L.marker([sp.lat,sp.lng],{icon:L.divIcon({html:`<div class="fj-marker fj-spot">✕</div>`,className:'',iconSize:[24,24],iconAnchor:[12,12]})});
      m.bindPopup(`<div class="fj-popup"><div class="pnm">${esc(sp.name)}</div><div class="pmeta">saved spot</div></div>`);

/* ============================================================= *
 *  PHASE 3 — weather, photos, enrichment                        *
 * ============================================================= */

/* ---- weather — Open-Meteo (§9.1) ---- */
const WMO={0:'Clear',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Rime fog',
  51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',56:'Freezing drizzle',57:'Freezing drizzle',
  61:'Light rain',63:'Rain',65:'Heavy rain',66:'Freezing rain',67:'Freezing rain',
  71:'Light snow',73:'Snow',75:'Heavy snow',77:'Snow grains',
  80:'Rain showers',81:'Rain showers',82:'Violent showers',85:'Snow showers',86:'Snow showers',
  95:'Thunderstorm',96:'Thunderstorm w/ hail',99:'Thunderstorm w/ hail'};
function wmoCondition(c){return WMO[c]!=null?WMO[c]:'—';}
function weatherGlyphId(c){
  if(c===0||c===1)return'wx-sun';
  if(c===2)return'wx-partly';
  if(c===3)return'wx-cloud';
  if(c===45||c===48)return'wx-fog';
  if((c>=51&&c<=67)||(c>=80&&c<=82))return'wx-rain';
  if((c>=71&&c<=77)||(c>=85&&c<=86))return'wx-snow';
  if(c>=95)return'wx-storm';
  return'wx-cloud';
}
function weatherGlyph(c){return `<svg class="ico"><use href="#${weatherGlyphId(c)}"/></svg>`;}
function weatherText(w){
  if(!w)return null;
  const unit=(state.meta&&state.meta.settings&&state.meta.settings.units)||'imperial';
  const t=unit==='metric'?`${w.tempC}°C`:`${w.tempF}°F`;
  return `${t}, ${w.condition}`;
}
function todMidHour(tod){return {morning:9,afternoon:14,evening:18,night:23}[tod]||12;}
function daysBetweenLocal(fromISO,toISO){return Math.round((parseLocal(toISO)-parseLocal(fromISO))/864e5);}
function pickHourFromSeries(H,dateISO,hh){        // returns index into hourly arrays or -1
  if(!H||!H.time||!H.time.length)return -1;
  let idx=H.time.indexOf(`${dateISO}T${pad(hh)}:00`);
  if(idx>=0)return idx;
  const sameDate=[];for(let i=0;i<H.time.length;i++)if(H.time[i].startsWith(dateISO+'T'))sameDate.push(i);
  if(!sameDate.length)return -1;
  return sameDate[Math.min(hh,sameDate.length-1)];
}
async function fetchWeatherFor(id){
  if(!navigator.onLine)return;                    // stays pending; queue retries
  const s0=state.sightings.find(x=>x.id===id);
  if(!s0)return;
  if(!s0.location||s0.location.lat==null){if(s0.weatherPending){s0.weatherPending=false;delete s0.weatherTries;await idbPut('sightings',s0);}return;}
  const lat=s0.location.lat,lng=s0.location.lng,dateISO=s0.dateISO;
  let hh=12;if(s0.exactTime)hh=+s0.exactTime.split(':')[0];else if(s0.timeOfDay)hh=todMidHour(s0.timeOfDay);
  const daysAgo=daysBetweenLocal(dateISO,todayLocal());
  if(daysAgo<0){s0.weatherPending=false;delete s0.weatherTries;await idbPut('sightings',s0);return;} // future date — no weather to fetch, stop retrying
  const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),6000);
  let w=null,hardError=false;
  try{
    // Within ~7 days (incl. today): forecast API with past_days hourly — the
    // archive (ERA5) endpoint lags 2–5 days, which used to strand offline entries.
    // Older than that: archive, which by then reliably has the data.
    const url=(daysAgo<=7)
      ? `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&hourly=temperature_2m,precipitation,weather_code&past_days=7&forecast_days=1&timezone=auto`
      : `https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lng}&start_date=${dateISO}&end_date=${dateISO}&hourly=temperature_2m,precipitation,weather_code&timezone=auto`;
    const r=await fetch(url,{signal:ctrl.signal});
    if(!r.ok){hardError=true;}
    else{
      const j=await r.json();const H=j.hourly;const idx=pickHourFromSeries(H,dateISO,hh);
      if(idx>=0&&H.temperature_2m[idx]!=null){const C=H.temperature_2m[idx],code=H.weather_code[idx];
        w={tempC:Math.round(C),tempF:Math.round(C*9/5+32),condition:wmoCondition(code),wmoCode:code,
          precipMm:H.precipitation?H.precipitation[idx]:null,source:'open-meteo',fetchedAt:nowISO()};}
      // else: data not published yet — leave pending, retry later WITHOUT counting a try
    }
    clearTimeout(to);
  }catch(e){clearTimeout(to);hardError=true;}
  // Re-find: an edit during the await may have replaced the array entry; writing
  // s0 back would silently revert that edit. Bail if it's gone or already resolved.
  const cur=state.sightings.find(x=>x.id===id);
  if(!cur||!cur.weatherPending)return;
  if(w){cur.weather=w;cur.weatherPending=false;delete cur.weatherTries;await idbPut('sightings',cur);
    if(currentTab()==='journal')renderJournal();}
  else if(hardError){await bumpWeatherTries(cur);}   // only hard errors (network/4xx/5xx) count toward the cap
}
async function bumpWeatherTries(s){                // cap hard-error retries so it doesn't loop forever
  s.weatherTries=(s.weatherTries||0)+1;
  if(s.weatherTries>=6){s.weatherPending=false;delete s.weatherTries;}
  await idbPut('sightings',s);
}
let weatherQueueRunning=false;
async function processWeatherQueue(){
  if(weatherQueueRunning||!navigator.onLine)return;
  const pending=state.sightings.filter(s=>s.weatherPending&&s.location&&s.location.lat!=null);
  if(!pending.length)return;
  weatherQueueRunning=true;
  try{for(const s of pending){await fetchWeatherFor(s.id);await sleep(350);}}
  finally{weatherQueueRunning=false;}
}

/* ---- photos (§9.3) ---- */
let photoUrls=[];
function revokePhotoUrls(){photoUrls.forEach(u=>{try{URL.revokeObjectURL(u);}catch(e){}});photoUrls=[];}
async function compressImage(file){
  let bmp;
  try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'});}
  catch(e){bmp=await createImageBitmap(file);}
  const draw=(maxEdge,q)=>{
    const scale=Math.min(1,maxEdge/Math.max(bmp.width,bmp.height));
    const cw=Math.max(1,Math.round(bmp.width*scale)),ch=Math.max(1,Math.round(bmp.height*scale));
    const c=document.createElement('canvas');c.width=cw;c.height=ch;
    c.getContext('2d').drawImage(bmp,0,0,cw,ch);
    return new Promise(res=>c.toBlob(b=>res({blob:b,w:cw,h:ch}),'image/jpeg',q));
  };
  const full=await draw(1280,0.72);
  const thumb=await draw(200,0.7);
  if(bmp.close)bmp.close();
  return {full:full.blob,thumb:thumb.blob,width:full.w,height:full.h};
}
/* ---- §3.2 EXIF parser — pure, standalone, vanilla ----
 * Parses the RAW File bytes (before compressImage's canvas re-encode strips
 * all metadata). JPEG only: APP1 "Exif\0\0" → TIFF (both byte orders) →
 * DateTimeOriginal + GPS. EXIF time is camera-local; used as-is, no TZ math.
 * Probe verified (2026-07-10, target iPhone): library picks of Camera photos
 * arrive as JPEG with date+GPS intact; live captures lack date/GPS; screenshots
 * are PNG. Malformed/absent EXIF must never break photo attachment → null.
 */
async function parseExif(file){   // → {dateISO,exactTime,lat,lng} (fields nullable) | null
  try{
    const v=new DataView(await file.slice(0,131072).arrayBuffer());   // APP1 lives near the start
    if(v.byteLength<4||v.getUint16(0)!==0xFFD8)return null;           // not a JPEG
    let off=2,tiff=-1;
    while(off+4<=v.byteLength){                                       // walk JPEG segments
      const marker=v.getUint16(off),len=v.getUint16(off+2);
      if((marker&0xFF00)!==0xFF00||marker===0xFFDA)break;             // corrupt or image data reached
      if(marker===0xFFE1&&off+12<=v.byteLength&&v.getUint32(off+4)===0x45786966&&v.getUint16(off+8)===0){tiff=off+10;break;}
      off+=2+len;
    }
    if(tiff<0)return null;
    const le=v.getUint16(tiff)===0x4949;                              // 'II' little-endian / 'MM' big-endian
    const u16=o=>v.getUint16(tiff+o,le),u32=o=>v.getUint32(tiff+o,le);
    if(u16(2)!==42)return null;
    let exifPtr=0,gpsPtr=0;
    const walk=(dir,cb)=>{const n=u16(dir);for(let i=0;i<n&&i<512;i++){const e=dir+2+i*12;cb(u16(e),e);}};
    walk(u32(4),(tag,e)=>{if(tag===0x8769)exifPtr=u32(e+8);if(tag===0x8825)gpsPtr=u32(e+8);});
    const ascii=e=>{const cnt=u32(e+4),o=cnt<=4?e+8:u32(e+8);let s='';
      for(let i=0;i<Math.min(cnt,64)-1;i++)s+=String.fromCharCode(v.getUint8(tiff+o+i));return s;};
    const rat=o=>u32(o)/(u32(o+4)||1);
    let dateISO=null,exactTime=null,lat=null,lng=null;
    if(exifPtr)walk(exifPtr,(tag,e)=>{if(tag===0x9003){                // DateTimeOriginal "YYYY:MM:DD HH:MM:SS"
      const m=ascii(e).match(/^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2})/);
      if(m&&+m[2]>=1&&+m[2]<=12&&+m[3]>=1&&+m[3]<=31&&+m[4]<=23&&+m[5]<=59){
        dateISO=`${m[1]}-${m[2]}-${m[3]}`;exactTime=`${m[4]}:${m[5]}`;}
    }});
    if(gpsPtr){
      let latRef='',lngRef='',la=null,ln=null;
      walk(gpsPtr,(tag,e)=>{
        if(tag===1)latRef=ascii(e);else if(tag===3)lngRef=ascii(e);
        else if(tag===2||tag===4){const o=u32(e+8),val=rat(o)+rat(o+8)/60+rat(o+16)/3600; // deg/min/sec rationals
          if(tag===2)la=val;else ln=val;}
      });
      if(la!=null&&ln!=null){
        if(latRef==='S')la=-la;if(lngRef==='W')ln=-ln;
        if(isFinite(la)&&isFinite(ln)&&Math.abs(la)<=90&&Math.abs(ln)<=180&&!(la===0&&ln===0)){lat=la;lng=ln;}
      }
    }
    return(dateISO||lat!=null)?{dateISO,exactTime,lat,lng}:null;
  }catch(e){return null;}
}

/* ---- §3.3 EXIF suggestion chip — suggest, never clobber ----
 * The form pre-selects last-used spot and today's date, so silent filling is
 * wrong. Instead the first photo of a selection that yields EXIF offers a
 * dismissible chip; only tapping "Use" applies. Cleared on save/reset, on
 * dismissal, and when all photos are removed. Shown in edit mode too; never
 * auto-applied.
 */
function fmtExifWhen(dateISO,exactTime){
  const d=parseLocal(dateISO);
  const opts={month:'short',day:'numeric'};
  if(d.getFullYear()!==new Date().getFullYear())opts.year='numeric';
  let s=new Intl.DateTimeFormat('en-US',opts).format(d);
  if(exactTime){const p=exactTime.split(':');const dt=new Date(d);dt.setHours(+p[0],+p[1]);
    s+=', '+new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit'}).format(dt);}
  return s;
}
function renderExifChip(){
  const box=$('#exifChip');if(!box)return;
  const sg=state.form.exifSuggest;
  if(!sg){box.innerHTML='';return;}
  const parts=[];
  if(sg.dateISO)parts.push(`taken <b>${esc(fmtExifWhen(sg.dateISO,sg.exactTime))}</b>`);
  if(sg.lat!=null)parts.push(`near <b>${esc(sg.placeName||`${sg.lat.toFixed(4)}, ${sg.lng.toFixed(4)}`)}</b>`);
  box.innerHTML=`<div class="exif-chip"><span>📷</span><span class="xc-txt">Photo ${parts.join(', ')}</span>
    <button class="act" id="exifUse" type="button" style="min-height:40px;padding:8px 16px">Use</button>
    <button class="iconbtn" id="exifDismiss" type="button" aria-label="Dismiss photo suggestion"><svg class="ico" style="width:18px;height:18px"><use href="#ui-close"/></svg></button></div>`;
  $('#exifUse').onclick=applyExifSuggest;
  $('#exifDismiss').onclick=()=>{state.form.exifSuggest=null;renderExifChip();};
}
// Resolve a place name into the chip when online. Stale-guard by suggestion
// object identity — a save/dismiss/new-selection during the await drops the result.
function geocodeExifSuggest(){
  const sg=state.form.exifSuggest;
  if(!sg||sg.lat==null||sg.placeName!=null||!navigator.onLine)return;
  reverseGeocode(sg.lat,sg.lng).then(nm=>{
    if(nm&&state.form.exifSuggest===sg){sg.placeName=nm;renderExifChip();}
  }).catch(()=>{});
}
function applyExifSuggest(){
  const f=state.form,sg=f.exifSuggest;if(!sg)return;
  if(sg.dateISO)f.dateISO=sg.dateISO>todayLocal()?todayLocal():sg.dateISO;   // camera clock skew → clamp like everywhere else
  if(sg.exactTime){f.exactTime=sg.exactTime;f.timeOfDay=todOfHour(+sg.exactTime.split(':')[0]);}
  if(sg.lat!=null){
    f.coords={lat:sg.lat,lng:sg.lng};f.locKind='pin';f.spotId=null;
    f.placeName=sg.placeName!=null?sg.placeName:null;                        // chip may have resolved it already
    if(f.placeName==null&&navigator.onLine){
      const lat=sg.lat;
      reverseGeocode(sg.lat,sg.lng).then(nm=>{                               // useCurrentLocation's stale-guard pattern
        if(nm&&f===state.form&&f.coords&&f.coords.lat===lat){f.placeName=nm;updatePlaceName();}
      }).catch(()=>{});
    }
  }
  f.exifSuggest=null;
  renderLog();
}
async function addPhotos(files){
  const arr=Array.from(files||[]).filter(f=>f.type&&f.type.startsWith('image/'));
  if(!arr.length)return;
  // §3.3: offer a suggestion from the FIRST photo of the selection that yields
  // EXIF — only when the date differs from the form or coords are present.
  if(!state.form.exifSuggest){
    for(const f of arr){
      const ex=await parseExif(f);
      if(ex){
        if((ex.dateISO&&ex.dateISO!==state.form.dateISO)||ex.lat!=null){
          state.form.exifSuggest={dateISO:ex.dateISO,exactTime:ex.exactTime,lat:ex.lat,lng:ex.lng,placeName:null};
          renderExifChip();geocodeExifSuggest();
        }
        break;                                   // first-with-EXIF wins
      }
    }
  }
  if(!state.form.photos)state.form.photos=[];
  const box=$('#photoThumbs');
  for(const file of arr){
    const spin=el('div',{class:'thumb loading',html:'<div class="spin"></div>'});box.appendChild(spin);
    try{const c=await compressImage(file);state.form.photos.push({id:uuid(),thumb:c.thumb,full:c.full,width:c.width,height:c.height,persisted:false});}
    catch(e){console.error('photo compress failed',e);toast('Could not read that photo',null);}
    spin.remove();renderPhotoThumbs();
    await sleep(0);                                // yield so UI stays responsive
  }
}
function renderPhotoThumbs(){
  const box=$('#photoThumbs');if(!box)return;
  revokePhotoUrls();box.innerHTML='';
  (state.form.photos||[]).forEach((p,idx)=>{
    const url=URL.createObjectURL(p.thumb);photoUrls.push(url);
    const wrap=el('div',{class:'thumb'});
    wrap.innerHTML=`<img src="${url}" alt="photo"><button class="thumb-x" type="button" aria-label="Remove photo">×</button>`;
    wrap.querySelector('.thumb-x').onclick=()=>{state.form.photos.splice(idx,1);renderPhotoThumbs();};
    box.appendChild(wrap);
  });
  if(!(state.form.photos||[]).length)state.form.exifSuggest=null;   // §3.3: chip clears when all photos are removed
  renderExifChip();
}

/* ---- journal row thumbnail (lazy object URLs, revoked on full re-render) ---- */
let journalPhotoUrls=[];
function revokeJournalPhotoUrls(){journalPhotoUrls.forEach(u=>{try{URL.revokeObjectURL(u);}catch(e){}});journalPhotoUrls=[];}
async function loadRowThumb(imgEl,photoId){
  try{const p=await idbGet('photos',photoId);if(!p||!p.thumb||!imgEl.isConnected)return;
