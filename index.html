/* ---- photo zoom overlay (owns its own full-size object URL) ---- */
let zoomUrl=null;
function openZoom(url){if(zoomUrl)URL.revokeObjectURL(zoomUrl);zoomUrl=url;$('#zoomImg').src=url;$('#zoom').classList.add('show');}
function closeZoom(){$('#zoom').classList.remove('show');$('#zoomImg').src='';if(zoomUrl){URL.revokeObjectURL(zoomUrl);zoomUrl=null;}}
async function zoomPhoto(pid){const p=await idbGet('photos',pid);if(p&&p.full)openZoom(URL.createObjectURL(p.full));}

/* ---- detail: photo strip renders THUMBS; full is decoded only on tap ---- */
let detailPhotoUrls=[];
function revokeDetailPhotoUrls(){detailPhotoUrls.forEach(u=>{try{URL.revokeObjectURL(u);}catch(e){}});detailPhotoUrls=[];}
async function renderPhotoStrip(boxId,photoIds){
  const box=$('#'+boxId);if(!box)return;
  revokeDetailPhotoUrls();box.innerHTML='';
  for(const pid of(photoIds||[])){
    const p=await idbGet('photos',pid);if(!p||!p.thumb)continue;
    const url=URL.createObjectURL(p.thumb);detailPhotoUrls.push(url);
    const img=new Image();img.src=url;img.alt='sighting photo';
    img.onclick=()=>zoomPhoto(pid);      // lazily fetch the full-size only when zoomed
    box.appendChild(img);
  }
}
function wireDetailPhotos(s){return renderPhotoStrip('detailPhotos',s.photoIds||[]);}

/* ============================================================= *
 *  PHASE 4 — Almanac: analytics, heatmap, charts, plates, notes *
 * ============================================================= */
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTHS_SHORT=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const SEASONS=[['Winter',[12,1,2]],['Spring',[3,4,5]],['Summer',[6,7,8]],['Fall',[9,10,11]]];
const monthOf=iso=>+iso.slice(5,7), yearOf=iso=>+iso.slice(0,4);
function seasonOfMonth(m){for(const[n,ms]of SEASONS)if(ms.includes(m))return n;return'';}
function freqByMonth(list){const a=Array(12).fill(0);list.forEach(s=>a[monthOf(s.dateISO)-1]++);return a;}
function freqBySeason(list){const o={Winter:0,Spring:0,Summer:0,Fall:0};list.forEach(s=>o[seasonOfMonth(monthOf(s.dateISO))]++);return o;}
function sightingYears(){return[...new Set(state.sightings.map(s=>yearOf(s.dateISO)))].sort((a,b)=>a-b);}
// Pager bounds: the years with data, always including the current year even if empty.
function yearRange(){const ys=sightingYears();const cy=new Date().getFullYear();if(!ys.includes(cy))ys.push(cy);return[Math.min(...ys),Math.max(...ys)];}
function speciesSightings(id){return state.sightings.filter(s=>s.speciesId===id).sort((a,b)=>a.dateISO<b.dateISO?-1:(a.dateISO>b.dateISO?1:0));}
function speciesStats(id){
  const list=speciesSightings(id);if(!list.length)return null;
  const fm=freqByMonth(list);const mostMonth=fm.indexOf(Math.max(...fm));
  const spotCount={};list.forEach(s=>{const n=s.location&&s.location.placeName;if(n)spotCount[n]=(spotCount[n]||0)+1;});
  let mostSpot=null,mx=0;for(const k in spotCount)if(spotCount[k]>mx){mx=spotCount[k];mostSpot=k;}
  return{total:list.length,first:list[0].dateISO,last:list[list.length-1].dateISO,mostMonth,mostSpot,freq:fm};
}
function plateNumber(id){const s=[...state.species].sort((a,b)=>(a.createdAt||'')<(b.createdAt||'')?-1:1);const i=s.findIndex(x=>x.id===id);return i>=0?i+1:'—';}
function speciesLink(id){const sp=speciesById(id);return `<span class="link-species" data-id="${id}">${esc(sp?sp.name:'Unknown')}</span>`;}
function onThisDay(){const t=todayLocal(),md=t.slice(5),y=yearOf(t);
  return state.sightings.filter(s=>s.dateISO.slice(5)===md&&yearOf(s.dateISO)<y);}

/* ---- engraved inline SVG bar chart (§7.4b, no chart library) ---- */
let chartSeq=0;
function barChartSVG(values,labels,opts){
  opts=opts||{};const W=opts.width||340,H=opts.height||150,pad={l:20,r:8,t:12,b:22};
  const max=Math.max(1,...values),n=values.length,bw=(W-pad.l-pad.r)/n,pid='hatch'+(++chartSeq);
  const bars=values.map((v,i)=>{
    const bh=(H-pad.t-pad.b)*(v/max),x=pad.l+i*bw+bw*0.16,y=H-pad.b-bh,w=bw*0.68;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${bh.toFixed(1)}" fill="url(#${pid})" stroke="#2b2117" stroke-width="0.7"/>`+
      (v>0&&!opts.spark?`<text x="${(x+w/2).toFixed(1)}" y="${(y-2).toFixed(1)}" font-size="7" text-anchor="middle" fill="#6b5a45">${v}</text>`:'');
  }).join('');
  const xl=opts.spark?'':labels.map((l,i)=>`<text x="${(pad.l+i*bw+bw/2).toFixed(1)}" y="${H-pad.b+12}" font-size="7.5" text-anchor="middle" fill="#6b5a45" style="font-variant:small-caps">${esc(l)}</text>`).join('');
  return `<svg class="al-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="bar chart">
    <defs><pattern id="${pid}" width="4" height="4" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#f6f1e4"/><line x1="0" y1="0" x2="0" y2="4" stroke="#6b5a45" stroke-width="1"/></pattern></defs>
    <line x1="${pad.l}" y1="${H-pad.b}" x2="${W-pad.r}" y2="${H-pad.b}" stroke="#2b2117" stroke-width="0.8"/>${bars}${xl}</svg>`;
}

const almanac={view:'heatmap',year:new Date().getFullYear(),hmSpecies:'',
  freqSpecies:'',freqCategory:'',freqPerYear:false,freqYear:new Date().getFullYear()};
function speciesOptionsHtml(sel){
  const list=[...new Set(state.sightings.map(s=>s.speciesId))].map(speciesById).filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name));
  return `<option value="">All species</option>`+list.map(sp=>`<option value="${sp.id}"${sel===sp.id?' selected':''}>${esc(sp.name)}</option>`).join('');
}
function renderAlmanac(){
  renderOnThisDay('onThisDayAlmanac');
  $$('#almanacSeg button').forEach(b=>b.classList.toggle('sel',b.dataset.al===almanac.view));
  if(almanac.view==='heatmap')renderHeatmap();
  else if(almanac.view==='frequency')renderFrequency();
  else renderFieldNotes();
}
/* a) year heatmap */
function renderHeatmap(){
  const A=almanac,body=$('#almanacBody');
  revokeJournalPhotoUrls();   // day-list rows below reuse the journal thumb URLs — reclaim any from a prior render
  const inYear=state.sightings.filter(s=>yearOf(s.dateISO)===A.year&&(!A.hmSpecies||s.speciesId===A.hmSpecies));
  const perDay={};inYear.forEach(s=>{perDay[s.dateISO]=(perDay[s.dateISO]||0)+1;});
  const max=Math.max(1,...Object.values(perDay));
  const ink=c=>c?`rgba(43,33,23,${(0.18+0.82*(c/max)).toFixed(2)})`:'var(--paper-3)';
  let rows='';
  for(let m=1;m<=12;m++){const dim=new Date(A.year,m,0).getDate();let cells='';
    for(let d=1;d<=dim;d++){const iso=`${A.year}-${pad(m)}-${pad(d)}`,c=perDay[iso]||0;
      cells+=`<div class="heat-cell${c?' has':''}" data-iso="${iso}" title="${iso}: ${c}" style="background:${ink(c)}"></div>`;}
    rows+=`<div class="heat-row"><span class="heat-mon">${MONTHS_SHORT[m-1]}</span>${cells}</div>`;}
  body.innerHTML=`
    <div class="al-controls">
      <div class="year-pager"><button id="hmPrev" aria-label="Previous year">‹</button><span class="yr">${A.year}</span><button id="hmNext" aria-label="Next year">›</button></div>
      <select id="hmSpecies" aria-label="Filter species">${speciesOptionsHtml(A.hmSpecies)}</select>
    </div>
    <div class="heat-table">${rows}</div>
    <div class="heat-legend">less <span class="heat-cell" style="background:${ink(0)}"></span><span class="heat-cell" style="background:${ink(Math.ceil(max/3))}"></span><span class="heat-cell" style="background:${ink(Math.ceil(2*max/3))}"></span><span class="heat-cell" style="background:${ink(max)}"></span> more</div>
    <div class="muted" style="margin-top:8px">${inYear.length} sighting${inYear.length!==1?'s':''} in ${A.year}${A.hmSpecies?' · '+esc(speciesById(A.hmSpecies).name):''}</div>
    <div class="day-list" id="hmDayList"></div>`;
  const[minY,maxY]=yearRange();
  $('#hmPrev').disabled=A.year<=minY;$('#hmNext').disabled=A.year>=maxY;
  $('#hmPrev').onclick=()=>{if(A.year>minY){A.year--;renderHeatmap();}};
  $('#hmNext').onclick=()=>{if(A.year<maxY){A.year++;renderHeatmap();}};
  $('#hmSpecies').onchange=e=>{A.hmSpecies=e.target.value;renderHeatmap();};
  body.querySelectorAll('.heat-cell.has').forEach(c=>c.onclick=()=>showHeatmapDay(c.dataset.iso));
  if(A.pendingDay){const d=A.pendingDay;A.pendingDay=null;showHeatmapDay(d);}   // one-shot, set by On-This-Day cards
}
// Populate the heatmap day-list for one date. Extracted so On-This-Day cards can
// route here too. Reuses the journal thumb-URL array (revoked on each rebuild).
function showHeatmapDay(iso){
  const box=$('#hmDayList');if(!box)return;
  revokeJournalPhotoUrls();
  box.innerHTML=`<div class="al-title">${fmtDayHead(iso)}</div>`;
  state.sightings.filter(s=>s.dateISO===iso&&(!almanac.hmSpecies||s.speciesId===almanac.hmSpecies)).forEach(s=>box.appendChild(entryRow(s)));
  box.scrollIntoView({behavior:'smooth',block:'nearest'});
}
/* b) frequency by month + season */
function renderFrequency(){
  const A=almanac,body=$('#almanacBody'),years=sightingYears();
  const catOpts=`<option value="">All categories</option>`+CATS.map(c=>`<option value="${c}"${A.freqCategory===c?' selected':''}>${CAT_LABEL[c]}</option>`).join('');
  const list=state.sightings.filter(s=>{
    if(A.freqSpecies&&s.speciesId!==A.freqSpecies)return false;
    if(A.freqCategory){const sp=speciesById(s.speciesId);if(!sp||sp.category!==A.freqCategory)return false;}
    if(A.freqPerYear&&yearOf(s.dateISO)!==A.freqYear)return false;
    return true;});
  const fm=freqByMonth(list),fs=freqBySeason(list);
  const yearToggle=years.length?`<label class="chk" style="font-size:13px"><input type="checkbox" id="freqPY" ${A.freqPerYear?'checked':''}> per year</label>`+
    (A.freqPerYear?`<div class="year-pager"><button id="fyPrev">‹</button><span class="yr">${A.freqYear}</span><button id="fyNext">›</button></div>`:''):'';
  body.innerHTML=`
    <div class="al-controls"><select id="freqSpecies" aria-label="Species">${speciesOptionsHtml(A.freqSpecies)}</select><select id="freqCategory" aria-label="Category">${catOpts}</select></div>
    <div class="al-controls">${yearToggle}</div>
    <div class="al-title">By month${A.freqPerYear?' · '+A.freqYear:(years.length>1?' · all years':'')}</div>
    ${barChartSVG(fm,MONTHS_SHORT,{width:340,height:150})}
    <div class="al-title">By season</div>
    <div class="season-band">${SEASONS.map(([n])=>`<div class="season-cell"><div class="sv">${fs[n]}</div><div class="sl">${n}</div></div>`).join('')}</div>
    <div class="muted" style="margin-top:10px">${list.length} sighting${list.length!==1?'s':''}</div>`;
  $('#freqSpecies').onchange=e=>{A.freqSpecies=e.target.value;renderFrequency();};
  $('#freqCategory').onchange=e=>{A.freqCategory=e.target.value;renderFrequency();};
  const py=$('#freqPY');if(py)py.onchange=e=>{A.freqPerYear=e.target.checked;if(A.freqPerYear&&!years.includes(A.freqYear))A.freqYear=years[years.length-1];renderFrequency();};
  const[minY,maxY]=yearRange();
  const fp=$('#fyPrev');if(fp){fp.disabled=A.freqYear<=minY;fp.onclick=()=>{if(A.freqYear>minY){A.freqYear--;renderFrequency();}};}
  const fnx=$('#fyNext');if(fnx){fnx.disabled=A.freqYear>=maxY;fnx.onclick=()=>{if(A.freqYear<maxY){A.freqYear++;renderFrequency();}};}
}
/* c) field-notes summaries (templated, deterministic) */
function categoryTint(list){const c={};list.forEach(s=>{const sp=speciesById(s.speciesId);if(sp)c[sp.category]=(c[sp.category]||0)+1;});
  let best='plant',mx=-1;for(const k in c)if(c[k]>mx){mx=c[k];best=k;}return best;}
function seededPick(arr,seed){return arr[Math.abs(Math.floor(seed))%arr.length];}
// UUIDs are all length 36, so seed+id.length gave no per-species variation; sum
// the char codes instead so different species pick different phrasings.
function idCharSum(id){return id.split('').reduce((a,c)=>a+c.charCodeAt(0),0);}
// bySpecies: Map(speciesId → that species' sightings sorted asc by dateISO), built
// once by the caller so we don't re-filter+sort all sightings per species per month.
function monthFacts(y,m,list,bySpecies){
  const seed=y*13+m,ymPrefix=`${y}-${pad(m)}`,facts=[];
  const counts={};list.forEach(s=>counts[s.speciesId]=(counts[s.speciesId]||0)+1);
  const ids=Object.keys(counts);
  // superlative
  let topId=null,topN=0;for(const id in counts)if(counts[id]>topN){topN=counts[id];topId=id;}
  if(topId&&topN>=3)facts.push({p:5,t:seededPick([
    `The ${speciesLink(topId)} were having a moment — ${topN} sightings, the most of any species.`,
    `No species turned up more than the ${speciesLink(topId)}: ${topN} sightings.`,
    `${speciesLink(topId)} led the month with ${topN} sightings.`],seed)});
  // firsts (new to journal, or first-since)
  for(const id of ids){
    const all=bySpecies.get(id)||[];
    if(all[0]&&all[0].dateISO.slice(0,7)===ymPrefix)
      facts.push({p:6,t:seededPick([`A new species for the journal: ${speciesLink(id)}.`,`First-ever record: ${speciesLink(id)}.`],seed+idCharSum(id))});
    else{const prior=all.filter(s=>s.dateISO<ymPrefix+'-01');
      if(prior.length){const last=prior[prior.length-1],gap=(y*12+m)-(yearOf(last.dateISO)*12+monthOf(last.dateISO));
        if(gap>=4)facts.push({p:3,t:`Your first ${speciesLink(id)} since ${MONTHS[monthOf(last.dateISO)-1]}.`});}}
  }
  // time-of-day pattern
  for(const id of ids){const sl=list.filter(s=>s.speciesId===id&&s.timeOfDay);
    if(sl.length>=3){const tod=sl[0].timeOfDay;if(sl.every(s=>s.timeOfDay===tod))
      facts.push({p:4,t:`Every ${speciesLink(id)} this month appeared in the ${tod}.`});}}
  // weather-in-rain pattern (≥3 qualifying)
  const withWx=list.filter(s=>s.weather);
  if(withWx.length>=3){const rainy=withWx.filter(s=>(s.weather.precipMm>0)||/rain|drizzle|shower|thunder/i.test(s.weather.condition));
    if(rainy.length>=3)facts.push({p:4,t:`${rainy.length} of ${withWx.length} sightings came in the wet.`});}
  // prior-year comparison for top species
  if(topId){const prevN=(bySpecies.get(topId)||[]).filter(s=>s.dateISO.startsWith(`${y-1}-${pad(m)}`)).length;
    if(prevN>0){const ratio=topN/prevN;
      if(ratio>=2)facts.push({p:2,t:`Twice as many ${speciesLink(topId)} as last ${MONTHS[m-1]}.`});
      else if(ratio<=0.5)facts.push({p:2,t:`Fewer ${speciesLink(topId)} than last ${MONTHS[m-1]} (${topN} vs ${prevN}).`});}}
  return facts.sort((a,b)=>b.p-a.p).slice(0,3).map(f=>f.t);
}
function fieldNotePage(ym,list,bySpecies){
  const[y,m]=ym.split('-').map(Number),wash=`var(--wash-${categoryTint(list)})`;
  const nSpecies=new Set(list.map(s=>s.speciesId)).size;
  const lead=`In ${MONTHS[m-1]} you logged ${list.length} sighting${list.length!==1?'s':''} across ${nSpecies} species.`;
  return `<div class="notes-page" style="--wash:${wash}">
    <div class="np-head">${MONTHS[m-1]}, ${y} — Field Notes</div>
    <p class="np-lead">${lead}</p>${monthFacts(y,m,list,bySpecies).map(f=>`<p>${f}</p>`).join('')}</div>`;
}
function seasonKeyOf(y,m){const s=seasonOfMonth(m);if(s==='Winter'&&m===12)return`${y}-${y+1}-Winter`;if(s==='Winter')return`${y-1}-${y}-Winter`;return`${y}-${s}`;}
// ---- season rollups (§2.1) — one page per COMPLETED season, above its newest month ----
const SEASON_ORDER={Winter:0,Spring:1,Summer:2,Fall:3};
function seasonEndYM(sk){const p=sk.split('-');           // "A-B-Winter" ends Feb of B; else May/Aug/Nov of Y
  if(p[p.length-1]==='Winter')return[+p[1],2];
  return{Spring:[+p[0],5],Summer:[+p[0],8],Fall:[+p[0],11]}[p[1]];}
function seasonComplete(sk){const[ey,em]=seasonEndYM(sk);const n=new Date();
  return n.getFullYear()*12+(n.getMonth()+1) > ey*12+em;}     // strictly past the last month → complete
function seasonMonthKeys(sk){const p=sk.split('-');           // the season's 3 'YYYY-MM' keys
  if(p[p.length-1]==='Winter')return[`${p[0]}-12`,`${p[1]}-01`,`${p[1]}-02`];
  const start={Spring:3,Summer:6,Fall:9}[p[1]];
  return[0,1,2].map(i=>`${p[0]}-${pad(start+i)}`);}
function seasonLabel(sk){const p=sk.split('-');
  if(p[p.length-1]==='Winter')return`Winter ${p[0]}–${String(p[1]).slice(2)}`;   // "Winter 2026–27"
  return`${p[1]} ${p[0]}`;}
function seasonSeed(sk){const p=sk.split('-');return(+p[0])*17+SEASON_ORDER[p[p.length-1]];}  // start-year anchored
function seasonFacts(sk,list,bySpecies,seed){
  const facts=[],counts={};list.forEach(s=>counts[s.speciesId]=(counts[s.speciesId]||0)+1);
  // superlative species over the whole season
  let topId=null,topN=0;for(const id in counts)if(counts[id]>topN){topN=counts[id];topId=id;}
  if(topId&&topN>=3)facts.push(seededPick([
    `The ${speciesLink(topId)} defined the season — ${topN} sightings, more than any other.`,
    `No species turned up more than the ${speciesLink(topId)} this season: ${topN} sightings.`,
    `${speciesLink(topId)} led the season with ${topN} sightings.`],seed));
  // firsts — species whose first-ever record falls within this season
  const firsts=[];for(const id in counts){const all=bySpecies.get(id)||[];
    if(all[0]&&seasonKeyOf(yearOf(all[0].dateISO),monthOf(all[0].dateISO))===sk)firsts.push(id);}
  if(firsts.length===1)facts.push(`A new species for the journal: ${speciesLink(firsts[0])}.`);
  else if(firsts.length>1)facts.push(seededPick([
    `${firsts.length} species new to the journal, including ${speciesLink(firsts[0])}.`,
    `First records for ${firsts.length} species this season, ${speciesLink(firsts[0])} among them.`],seed+firsts.length));
  return facts.slice(0,2);                                    // shorter than a monthly page
}
function seasonRollupPage(sk,list,bySpecies){
  const wash=`var(--wash-${categoryTint(list)})`,nSpecies=new Set(list.map(s=>s.speciesId)).size,seed=seasonSeed(sk);
  const lead=`Across the season, ${list.length} sighting${list.length!==1?'s':''} of ${nSpecies} species.`;
  const facts=seasonFacts(sk,list,bySpecies,seed);
  return `<div class="notes-page" style="--wash:${wash}">
    <div class="np-head">${seasonLabel(sk)} — Season Notes</div>
    <p class="np-lead">${lead}</p>${facts.map(f=>`<p>${f}</p>`).join('')}</div>`;
}
function renderFieldNotes(){
  const body=$('#almanacBody'),groups={};
  state.sightings.forEach(s=>{const k=s.dateISO.slice(0,7);(groups[k]=groups[k]||[]).push(s);});
  const keys=Object.keys(groups).sort().reverse();
  if(!keys.length){body.innerHTML=`<div class="empty"><svg class="ico"><use href="#ui-book"/></svg><p>No field notes yet — log a few sightings and monthly recaps appear here.</p></div>`;return;}
  // §2.3 perf: build speciesId → asc-sorted sightings ONCE and share it across every page.
  const bySpecies=new Map();
  state.sightings.forEach(s=>{if(!bySpecies.has(s.speciesId))bySpecies.set(s.speciesId,[]);bySpecies.get(s.speciesId).push(s);});
  bySpecies.forEach(arr=>arr.sort((a,b)=>a.dateISO<b.dateISO?-1:(a.dateISO>b.dateISO?1:0)));
  // Emit each completed season's rollup above the first (newest) month of that season.
  // `emitted` is shared with the deferred "earlier months" render so a season that
  // straddles the 12-month window boundary is never doubled.
  const emitted=new Set();
  const renderKeys=ks=>ks.map(k=>{
    const[y,m]=k.split('-').map(Number),sk=seasonKeyOf(y,m);let html='';
    if(!emitted.has(sk)){emitted.add(sk);
      if(seasonComplete(sk))html+=seasonRollupPage(sk,[].concat(...seasonMonthKeys(sk).map(mk=>groups[mk]||[])),bySpecies);}
    return html+fieldNotePage(k,groups[k],bySpecies);
  }).join('');
  const wireLinks=root=>root.querySelectorAll('.link-species').forEach(a=>a.onclick=()=>openSpeciesPlate(a.dataset.id));
  const recent=keys.slice(0,12),earlier=keys.slice(12);   // §2.3: only the 12 most recent months up front
  body.innerHTML=renderKeys(recent)+
    (earlier.length?`<button class="act ghost" id="fnMore" style="width:100%;margin-top:8px">Show earlier months</button><div id="fnEarlier"></div>`:'');
  wireLinks(body);
  const more=$('#fnMore');
  if(more)more.onclick=()=>{const box=$('#fnEarlier');box.innerHTML=renderKeys(earlier);wireLinks(box);more.remove();};
}

/* ---- on this day (§7.4) ---- */
function renderOnThisDay(boxId){
  const box=$('#'+boxId);if(!box)return;box.innerHTML='';
  const list=onThisDay();if(!list.length)return;
  const byYear={};list.forEach(s=>{(byYear[yearOf(s.dateISO)]=byYear[yearOf(s.dateISO)]||[]).push(s);});
  Object.keys(byYear).sort().reverse().forEach(y=>{
    const items=byYear[y],counts={};items.forEach(s=>counts[s.speciesId]=(counts[s.speciesId]||0)+1);
    const parts=Object.entries(counts).map(([id,n])=>{const nm=speciesById(id)?speciesById(id).name:'?';return `${n} ${nm}${n>1?'s':''}`;});
    const place=items.find(s=>s.location&&s.location.placeName);
    // Single-species day → the plate. Multi-species day → the Almanac heatmap for
    // that date's day-list, rather than arbitrarily picking one species' plate.
    const onCard=()=>{
      if(Object.keys(counts).length<=1){openSpeciesPlate(items[0].speciesId);return;}
      almanac.view='heatmap';almanac.year=+y;almanac.hmSpecies='';
      // Hand the date to renderHeatmap via pendingDay: routeTo's own render
      // consumes it, so no timer race with the async hashchange and no double render.
      almanac.pendingDay=`${y}-${todayLocal().slice(5)}`;
      if(currentTab()==='almanac')renderAlmanac();else location.hash='#almanac';
    };
    const card=el('div',{class:'otd-card',onclick:onCard});
    card.innerHTML=`<svg class="ico"><use href="#ui-book"/></svg><div><div class="otd-h">On this day in ${y}</div>`+
      `<div class="otd-b">${esc(parts.join(', '))}${place?' — '+esc(place.location.placeName):''}</div></div>`;
    box.appendChild(card);
  });
}

/* ---- species detail plate (§7.5) ---- */
function openSpeciesPlate(id){
  const sp=speciesById(id);if(!sp)return;
  const st=speciesStats(id),list=speciesSightings(id).slice().reverse();
  const hasPts=list.some(s=>s.location&&s.location.lat!=null);
  const photoIds=[].concat(...list.map(s=>s.photoIds||[]));
  const statHtml=st?`<div class="stat-band">
      <div><div class="st">Sightings</div><div class="sv">${st.total}</div></div>
      <div><div class="st">First seen</div><div class="sv">${fmtDate(st.first)}</div></div>
      <div><div class="st">Latest</div><div class="sv">${fmtDate(st.last)}</div></div>
      <div><div class="st">Most in</div><div class="sv">${MONTHS[st.mostMonth]}</div></div>
      <div><div class="st">Usual spot</div><div class="sv">${st.mostSpot?esc(st.mostSpot):'—'}</div></div>
    </div>`:'<p class="muted">No sightings logged yet.</p>';
  const specHtml=list.map(s=>`<div class="specimen"><div class="sd">${fmtDate(s.dateISO)}${s.timeOfDay?' · '+TOD_LABEL[s.timeOfDay]:''}${s.weather?' · '+esc(weatherText(s.weather)):''}</div>`+
    `<div class="sb">${esc((s.location&&s.location.placeName)||'—')}${s.count!=null?' · ×'+s.count:''}${s.notes?' — '+esc(s.notes.split('\n')[0]):''}</div></div>`);
  const SPEC_CAP=50;                                   // cap the initial render for busy species
  const specimens=(specHtml.slice(0,SPEC_CAP).join('')||'<p class="muted">None yet.</p>')+
    (specHtml.length>SPEC_CAP?`<button class="act ghost" id="specMore" style="margin-top:8px">Show all ${specHtml.length} specimens</button>`:'');
  openSheet(`
    <div class="plate-illus" style="--wash:var(--wash-${sp.category})">${speciesIcon(sp,'ico')}</div>
    <div class="plate-cap"><div class="pn">${esc(sp.name)}</div><div class="pc">${esc(CAT_LABEL[sp.category])}</div><div class="plno">Plate No. ${plateNumber(id)}</div></div>
    ${statHtml}
    ${st?`<div class="al-title">By month</div>${barChartSVG(st.freq,MONTHS_SHORT,{width:340,height:110})}`:''}
    ${hasPts?`<div id="plateMap" style="height:150px;width:100%;border:1px solid var(--rule);border-radius:4px;background:var(--paper-3);margin:8px 0"></div>`:''}
    ${photoIds.length?`<div class="photo-strip" id="platePhotos"></div>`:''}
    <div class="al-title">Specimens</div><div id="specimenList">${specimens}</div>
    <div class="btnrow" style="margin-top:14px"><button class="act ghost" id="plClose">Close</button></div>`);
  const sm=$('#specMore');if(sm)sm.onclick=()=>{$('#specimenList').innerHTML=specHtml.join('');};
  let plateMap=null;
  sheetCleanup=()=>{if(plateMap){plateMap.remove();plateMap=null;}revokeDetailPhotoUrls();};
  if(hasPts&&typeof L!=='undefined')setTimeout(()=>{
    const pts=list.filter(s=>s.location&&s.location.lat!=null).map(s=>[s.location.lat,s.location.lng]);
    plateMap=L.map('plateMap',{zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,boxZoom:false,keyboard:false,tap:false});
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(plateMap);
    pts.forEach(p=>L.marker(p,{icon:L.divIcon({html:`<div class="fj-marker">${speciesIcon(sp)}</div>`,className:'',iconSize:[26,26],iconAnchor:[13,13]})}).addTo(plateMap));
    try{plateMap.fitBounds(pts,{padding:[30,30],maxZoom:13});}catch(e){if(pts[0])plateMap.setView(pts[0],12);}
    setTimeout(()=>plateMap&&plateMap.invalidateSize(),60);
  },90);
  if(photoIds.length)renderPhotoStrip('platePhotos',photoIds);
  $('#plClose').onclick=closeSheet;
}

/* ============================================================= *
 *  service worker + update banner                               *
 * ============================================================= */
let refreshing=false;
async function initSW(){
  if(!('serviceWorker'in navigator))return;
  try{
    const reg=await navigator.serviceWorker.register('sw.js');
    if(reg.waiting&&navigator.serviceWorker.controller)showUpdate(reg.waiting);
    reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(!nw)return;
      nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)showUpdate(nw);});});
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(refreshing)return;refreshing=true;location.reload();});
    // An installed iOS app resumes without a navigation, so the SW update check
    // can go stale for days. Re-check whenever the app returns to the foreground.
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{});});
  }catch(e){/* offline-first still works from cache */}
}
function showUpdate(worker){const b=$('#updateBanner');b.classList.add('show');
  $('#updateBtn').onclick=()=>{$('#updateBtn').textContent='Updating…';worker.postMessage({type:'SKIP_WAITING'});};}

/* go */
init();
</script>
